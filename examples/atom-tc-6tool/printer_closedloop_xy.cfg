# ==============================================================================
# VORON TOOLCHANGER — PRINTER.CFG WITH CLOSED-LOOP X/Y (TMC4671 + OUROBOROS)
# ==============================================================================
#
# Author: PrintStructor
# GitHub: https://github.com/PrintStructor
# Version: 0.1.0-alpha (EXPERIMENTAL)
#
# Description:
#   Modified printer.cfg showing integration of closed-loop TMC4671 servo
#   control on X/Y axes via Ouroboros board, while keeping TMC5160 Z-axis
#   and all toolchanger components unchanged.
#
# Changes from standard printer.cfg:
#   - REMOVED: [stepper_x], [tmc2209 stepper_x], [autotune_tmc stepper_x]
#   - REMOVED: [stepper_y], [tmc2209 stepper_y], [autotune_tmc stepper_y]
#   - ADDED: [include atom/ouroboros_xy.cfg] (contains all X/Y config)
#   - ADDED: [mcu ouroboros] in ouroboros_xy.cfg
#   - MODIFIED: Homing override for physical X endstop
#
# ⚠️  THIS IS A REFERENCE FILE — not a drop-in replacement!
#   Compare with your working printer.cfg and merge carefully.
#
# ==============================================================================

# ==============================================================================
# SECTION 1: SYSTEM CONFIGURATION (UNCHANGED)
# ==============================================================================

[include shell_command.cfg]
[include mainsail.cfg]

[rounded_path]
resolution: 0.2
replace_G0: false

[force_move]
enable_force_move: True

[input_shaper]

[save_variables]
filename: ~/printer_data/config/variables.cfg

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]
recover_velocity: 50

[display_status]
[exclude_object]

[gcode_arcs]
resolution: 0.1

# ==============================================================================
# SECTION 2: MCU DEFINITIONS
# ==============================================================================

[mcu]
canbus_uuid: bae68454ac29                  # Main Octopus Pro MCU

[mcu rpi]
serial: /tmp/klipper_host_mcu

[mcu rp2350]
serial: /dev/serial/by-id/usb-Klipper_rp2350_4B689D7A225EB994-if00

# NOTE: Ouroboros MCU is defined in ouroboros_xy.cfg

# ==============================================================================
# SECTION 3: PRINTER KINEMATICS (UNCHANGED)
# ==============================================================================

[printer]
kinematics: corexy
max_velocity: 1000
max_accel: 20000
max_z_velocity: 500
max_z_accel: 1000
square_corner_velocity: 15.0

[idle_timeout]
timeout: 1800
gcode:
    KNOMI_SLEEP
    SHUTDOWN_LEDS
    M84

# ==============================================================================
# SECTION 4: TEMPERATURE MONITORING (UNCHANGED)
# ==============================================================================

[include atom/knomi.cfg]

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor Octopus]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor rp2350]
sensor_type: temperature_mcu
sensor_mcu: rp2350
min_temp: 10
max_temp: 100

[temperature_sensor Chamber]
sensor_type: Generic 3950
Sensor_pin: PF5

# ==============================================================================
# SECTION 5: TOOLCHANGER INTEGRATION (UNCHANGED)
# ==============================================================================

[include atom/toolchanger.cfg]
[include atom/toolchanger_macros.cfg]
[include atom/beacon.cfg]
[include atom/T0.cfg]
[include atom/T1.cfg]
[include atom/T2.cfg]
[include atom/T3.cfg]
[include atom/T4.cfg]
[include atom/T5.cfg]
[include atom/calibrate_offsets.cfg]

[shaketune]
number_of_results_to_keep: 30

[duplicate_pin_override]
pins: PF3, PB10

# ==============================================================================
# SECTION 6: MOTION SYSTEM — X/Y CLOSED-LOOP (★ THIS IS THE KEY CHANGE ★)
# ==============================================================================
# REPLACES the original [stepper_x], [tmc2209 stepper_x], [autotune_tmc stepper_x]
#          and [stepper_y], [tmc2209 stepper_y], [autotune_tmc stepper_y]
# with TMC4671 closed-loop servo control via Ouroboros dual-driver board.
#
# The ouroboros_xy.cfg file contains:
#   - [mcu ouroboros] definition
#   - [stepper_x] with virtual steps (4096 × 2 microsteps)
#   - [tmc4671 stepper_x] with FOC, encoder, and PID configuration
#   - [stepper_y] with virtual steps (4096 × 2 microsteps)
#   - [tmc4671 stepper_y] with FOC, encoder, and PID configuration
#
# Prerequisites:
#   - Andrew's TMC4671 driver installed: https://github.com/andrewmcgr/tmc-4671
#   - Ouroboros board flashed with Klipper firmware
#   - LDO-42STH48-2504-E1000 motors wired with encoder cables
#   - Brake resistors installed
#   - Physical endstop on X-axis (sensorless homing not functional)

[include atom/ouroboros_xy.cfg]

# ==============================================================================
# SECTION 7: MOTION SYSTEM — Z STEPPERS TMC5160 (UNCHANGED)
# ==============================================================================
# Z-axis remains on TMC5160 drivers on Octopus Pro — no changes needed.

[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:20
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_max: 330
position_min: -5
homing_speed: 20
second_homing_speed: 3
homing_retract_dist: 0

[tmc5160 stepper_z]
cs_pin: PC6
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
interpolate: false
run_current: 1.25
sense_resistor: 0.075
stealthchop_threshold: 0

[autotune_tmc stepper_z]
motor: ldo-42sth48-2504ac
tuning_goal: performance
voltage: 24

[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:20
microsteps: 16
full_steps_per_rotation: 200

[tmc5160 stepper_z1]
cs_pin: PC7
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
interpolate: false
run_current: 1.25
sense_resistor: 0.075
stealthchop_threshold: 0

[autotune_tmc stepper_z1]
motor: ldo-42sth48-2504ac
tuning_goal: performance
voltage: 24

[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:20
microsteps: 16
full_steps_per_rotation: 200

[tmc5160 stepper_z2]
cs_pin: PF2
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
interpolate: false
run_current: 1.25
sense_resistor: 0.075
stealthchop_threshold: 0

[autotune_tmc stepper_z2]
motor: ldo-42sth48-2504ac
tuning_goal: performance
voltage: 24

[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:20
microsteps: 16
full_steps_per_rotation: 200

[tmc5160 stepper_z3]
cs_pin: PE4
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5
interpolate: false
run_current: 1.25
sense_resistor: 0.075
stealthchop_threshold: 0

[autotune_tmc stepper_z3]
motor: ldo-42sth48-2504ac
tuning_goal: performance
voltage: 24

# ==============================================================================
# SECTION 8: BED HEATER (UNCHANGED)
# ==============================================================================

[heater_bed]
heater_pin: PA3
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 0.65
min_temp: 0
max_temp: 130
control: pid
pid_kp: 58.437
pid_ki: 2.347
pid_kd: 363.769

# ==============================================================================
# SECTION 9: FAN CONTROL (UNCHANGED)
# ==============================================================================

[controller_fan controller_inlet]
pin: PD13
max_power: 0.65
kick_start_time: 0.5
heater: heater_bed

[controller_fan controller_exhaust]
pin: PD12
max_power: 0.65
kick_start_time: 0.5
heater: heater_bed

[temperature_fan nevermore]
pin: PD15
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
min_temp: 0
max_temp: 130
target_temp: 35
sensor_type: Generic 3950
sensor_pin: PF3
control: watermark

[controller_fan Octopus Fan]
pin: PA8
max_power: 0.80
kick_start_time: 0.5
off_below: 0.10
idle_timeout: 180
hardware_pwm: False
tachometer_pin: PE14
tachometer_ppr: 2

[fan_generic fan0]
pin: PB10
max_power: 0.72
shutdown_speed: 0
cycle_time: 0.005
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.03

[fan_generic fan3]
pin: PE5
cycle_time: 0.01
hardware_pwm: false

# ==============================================================================
# SECTION 10-14: REMAINING SECTIONS (UNCHANGED)
# ==============================================================================

[include atom/tc_led_effects.cfg]

[skew_correction]

[quad_gantry_level]
gantry_corners:
   -60,-10
   410,420
points:
   25,5
   25,295
   330,295
   330,5
speed: 400
horizontal_move_z: 2
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

[board_pins]
aliases:
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>

[include macros.cfg]

