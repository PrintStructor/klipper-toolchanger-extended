#### crowsnest.conf — ATOM TC-6 Toolchanger Example
####
#### This configuration shows how to set up multiple cameras:
####   - Cam 1: Main bed/print camera (overview)
####   - Cam 2: Secondary camera (optional, e.g., chamber view)
####   - Cam 3: kTAMV nozzle camera (for XY offset calibration)
####
#### Port mapping in Mainsail/Fluidd:
####   Port 8080 = /webcam/?action=[stream/snapshot]
####   Port 8081 = /webcam2/?action=[stream/snapshot]
####   Port 8082 = /webcam3/?action=[stream/snapshot]
####
#### Mainsail Webcam Setup Screenshots:
####   See docs/images/kTAMV_CAM_MAINSAIL.png   - kTAMV server camera config
####   See docs/images/qTC_CAM_MAINSAIL.png     - Nozzle camera config (with crosshair)
####
#### IMPORTANT: Device paths vary by system!
#### Run: v4l2-ctl --list-devices
#### to find your camera device paths.
####
#### For stable device paths, use /dev/v4l/by-path/ or /dev/v4l/by-id/
#### instead of /dev/video0 (which can change on reboot).


[crowsnest]
log_path: /home/pi/printer_data/logs/crowsnest.log
log_level: verbose                      # quiet/verbose/debug
delete_log: false                       # Delete log on restart
no_proxy: false


# ==============================================================================
# CAM 1: Main Bed/Print Camera
# ==============================================================================
# Overview camera for monitoring prints.
# Recommended: 1280x720 or 1920x1080, autofocus enabled.

[cam 1]
mode: camera-streamer                   # camera-streamer for Raspberry Pi
enable_rtsp: false
rtsp_port: 8554
port: 8080                              # Main webcam port

# CHANGE THIS to your camera's device path!
# Find with: v4l2-ctl --list-devices
device: /dev/v4l/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.3.4:1.0-video-index0

resolution: 1280x720                    # Good balance of quality/performance
max_fps: 30
v4l2ctl: focus_automatic_continuous=1   # Enable autofocus (if supported)


# ==============================================================================
# CAM 2: Secondary Camera (Optional)
# ==============================================================================
# Chamber view, side view, or additional angle.
# Comment out this section if not using a second camera.

[cam 2]
mode: camera-streamer
enable_rtsp: false
rtsp_port: 8555
port: 8081                              # /webcam2/

# CHANGE THIS to your camera's device path!
device: /dev/v4l/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.1.3:1.0-video-index0

resolution: 1920x1080                   # Higher res for detail
max_fps: 30
v4l2ctl: focus_automatic_continuous=1


# ==============================================================================
# CAM 3: kTAMV Nozzle Camera (for XY Calibration)
# ==============================================================================
# USB microscope or similar camera pointed at the nozzle from below.
# Used by kTAMV for automated XY offset measurement.
#
# Requirements:
#   - Fixed focus (or manual focus set to nozzle distance)
#   - Good lighting (kTAMV LEDs or ring light)
#   - Stable mount (no vibration)
#
# Recommended cameras:
#   - Logitech C270 (budget, manual focus mod recommended)
#   - Logitech C930e (better optics, electronic focus)
#   - USB microscope 5MP (best for nozzle detail)

[cam 3]
mode: camera-streamer
enable_rtsp: false
rtsp_port: 8556
port: 8082                              # /webcam3/ - Used by kTAMV

# CHANGE THIS to your kTAMV camera's device path!
device: /dev/v4l/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.3.2:1.0-video-index0

resolution: 1280x720                    # Higher res = better kTAMV accuracy
max_fps: 30

# kTAMV camera settings:
# - Disable autofocus for consistent measurements
# - Set manual focus if your camera supports it
#v4l2ctl: focus_automatic_continuous=0,focus_absolute=50

# Alternative: Keep autofocus on during setup, disable for calibration
v4l2ctl: focus_automatic_continuous=1


# ==============================================================================
# v4l2-ctl Reference (Common Camera Controls)
# ==============================================================================
#
# List available controls for your camera:
#   v4l2-ctl -d /dev/video0 --list-ctrls
#
# Common controls:
#   brightness=128              # 0-255
#   contrast=128                # 0-255
#   saturation=128              # 0-255
#   sharpness=128               # 0-255
#   white_balance_automatic=1   # 0=manual, 1=auto
#   focus_automatic_continuous=1 # 0=manual, 1=auto
#   focus_absolute=50           # Manual focus value (when auto=0)
#   exposure_auto=3             # 1=manual, 3=auto
#   exposure_absolute=166       # Manual exposure (when auto=1)
#
# Example for fixed focus kTAMV camera:
#   v4l2ctl: focus_automatic_continuous=0,focus_absolute=40,brightness=140


# ==============================================================================
# MAINSAIL WEBCAM CONFIGURATION
# ==============================================================================
# After setting up crowsnest, configure webcams in Mainsail:
# Settings → Interface Settings → WEBCAMS
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ CAMERA 1: qTC Nozzle (for visual monitoring)                                │
# │ See: docs/images/qTC_CAM_MAINSAIL.png                                       │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │ Name:          qTC Nozzle                                                   │
# │ URL Stream:    /webcam3/webrtc                                              │
# │ URL Snapshot:  /webcam3/?action=snapshot                                    │
# │ Service:       WebRTC (camera-streamer)                                     │
# │ Rotate:        0°                                                           │
# │ Flip:          (as needed)                                                  │
# │ Nozzle Crosshair: ✓ Enable (Color: Red, Size: adjust to nozzle)            │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ CAMERA 2: kTAMV (for automated XY calibration)                              │
# │ See: docs/images/kTAMV_CAM_MAINSAIL.png                                     │
# ├─────────────────────────────────────────────────────────────────────────────┤
# │ Name:          kTAMV                                                        │
# │ URL Stream:    (leave empty)                                                │
# │ URL Snapshot:  http://<pi-ip>:8085/image                                    │
# │ Service:       Adaptive MJPEG-Streamer (experimental)                       │
# │ Target FPS:    4                                                            │
# │ Rotate:        0°                                                           │
# │ Nozzle Crosshair: □ Disable (kTAMV has its own overlay)                    │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# Note: The kTAMV camera connects to the kTAMV server (port 8085), not directly
# to crowsnest. The kTAMV server handles image processing for nozzle detection.
