motor_profile: LDO_2504b-EN1000
# Filterfrequenzen: das README empfiehlt fuer NEMA-17-Motoren rund
# 1600 Hz fuer Drehmoment und 800 Hz fuer Fluss. Zu hoch -> Zischen
