# ==============================================================================
# OUROBOROS CLOSED-LOOP X/Y (TMC4671)
# ==============================================================================
# based on isiks.tech/Ouroboros/Stepper-Setup/
# NOTE: [mcu ouroboros] and temperature sensors are defined above

[stepper_x]
step_pin: ouroboros:PD4
dir_pin: !ouroboros:PD3
enable_pin: ouroboros:PD6
rotation_distance: 40
microsteps: 2
full_steps_per_rotation: 4096
endstop_pin: ^ouroboros:PD7
position_min: 0
position_endstop: 355
position_max: 355
homing_speed: 150
homing_retract_dist: 5
homing_positive_dir: true

[tmc4671 stepper_x]
# Profile statt einzeln zusammengesuchter Werte: motor_kt stand auf
# 0.0156, das LDO-Profil nennt 0.216. Nachpruefbar am Drehmoment -
# gemeldet wurden 0.0386 Nm, der 2504 hat 0.54 Nm Haltemoment.
# Explizit gesetzte Werte weiter unten gewinnen gegen das Profil.
board_profile: Ouroboros
motor_profile: LDO_2504b-EN1000
# Filterfrequenzen: das README empfiehlt fuer NEMA-17-Motoren rund
# 1600 Hz fuer Drehmoment und 800 Hz fuer Fluss. Zu hoch -> Zischen
# beim Fahren, zu tief -> Geraeusch im Stillstand und runde Ecken.
# Bisher standen hier 5000 (Drehmoment) und 300 (Fluss).
biquad_torque_frequency: 1600
biquad_flux_frequency: 800
biquad_velocity_frequency: 5000
biquad_position_frequency: 0
# Deine ueber Monate erprobten Reglerwerte. Ohne diese Zeilen greifen
# die Vorgaben des Board-Profils (4.5 / 2.5), die deutlich hoeher sind.
foc_pid_flux_p: 20.0
foc_pid_flux_i: 0.04
foc_pid_torque_p: 20.0
foc_pid_torque_i: 0.04
foc_pid_velocity_p: 1.07063
foc_pid_velocity_i: 0.00498
foc_pid_position_p: 1.27522
foc_pid_position_i: 0.00125
cs_pin: ouroboros:PD0
spi_bus: spi2
spi_speed: 2000000
# Schaltfrequenz hoch: bei 24414 Hz (Standard seit dem Plugin-Update)
# stieg das Sensorrauschen auf X von 16 auf 582, sobald die Motoren
# bestromt sind. Hoehere Frequenz schiebt die Stoerungen aus dem
# Messbereich des ADXL. Erlaubt sind 10 bis 150 kHz.
pwm_freq_target: 24414
current_scale_ma_lsb: 1.272
run_current: 3.5
flux_current: 0.02
foc_motor_type: 2
foc_n_pole_pairs: 50
foc_pwm_sv: 0
foc_adc_i_ux_select: 0
foc_adc_i_v_select: 2
foc_adc_i_wy_select: 1
foc_phi_e_selection: 3
foc_position_selection: 9
foc_velocity_selection: 9
foc_abn_decoder_ppr: 4000
foc_abn_direction: 1
#foc_pid_flux_p: 20.00
#foc_pid_flux_i: 0.040
#foc_pid_torque_p: 20.00
#foc_pid_torque_i: 0.040
#foc_pid_flux_p: 5.76
#foc_pid_flux_i: 0.040
#foc_pid_torque_p: 5.76
#foc_pid_torque_i: 0.040
#foc_pid_velocity_p: 1.07063
#foc_pid_velocity_i: 0.00498
#foc_pid_position_p: 1.27522
#foc_pid_position_i: 0.00125
#biquad_flux_frequency: 300
#biquad_torque_frequency: 5000
#biquad_velocity_frequency: 5000
biquad_position_frequency: 0

# ------------------------------------------------------------------------------

[stepper_y]
step_pin: ouroboros:PC12
dir_pin: !ouroboros:PC11
enable_pin: ouroboros:PD1
rotation_distance: 40
microsteps: 2
full_steps_per_rotation: 4096
endstop_pin: ^PG9
position_min: 0
position_endstop: 361
position_max: 361
homing_speed: 150
homing_retract_dist: 5
homing_positive_dir: true

[tmc4671 stepper_y]
