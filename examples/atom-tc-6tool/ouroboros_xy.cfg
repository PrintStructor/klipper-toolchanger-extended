# ==============================================================================
# VORON TOOLCHANGER — CLOSED-LOOP X/Y WITH TMC4671 + OUROBOROS
# ==============================================================================
#
# ⚠️  WARNING: THIS CONFIG CONTAINS EXAMPLE VALUES!
#
# YOU MUST CHANGE:
#   - MCU serial path (line ~55): Match YOUR Ouroboros board
#   - STEP/DIR/ENABLE pins: Match YOUR wiring to the Ouroboros MCU
#   - SPI pins: Match YOUR board's SPI bus configuration
#   - run_current: Calculate for YOUR specific motors (1.4 × rated current)
#   - PID values: Run TMC_TUNE_PID and TMC_TUNE_MOTION_PID for YOUR setup
#   - Encoder PPR: Verify for YOUR encoder (LDO 2504 = 4000 PPR)
#   - Endstop configuration: Physical endstops required (sensorless NOT working)
#
# Prerequisites:
#   - Andrew's TMC4671 Klipper driver installed:
#     https://github.com/andrewmcgr/tmc-4671
#   - Ouroboros board from Isik's Tech with TMC4671 + TMC6100
#   - LDO-42STH48-2504 motors with integrated 1000-line optical encoders
#   - Brake resistors installed and properly heat-managed
#   - Klipper firmware flashed on Ouroboros MCU
#
# ==============================================================================
#
# Author: PrintStructor
# GitHub: https://github.com/PrintStructor
# Version: 0.1.0-alpha (EXPERIMENTAL)
#
# Based on Andrew McGrath's TMC4671 Klipper driver
# Reference: https://github.com/andrewmcgr/tmc-4671
#
# Hardware:
#   - Ouroboros dual-driver board (Isik's Tech) — drives BOTH X and Y
#   - LDO-42STH48-2504-E1000 stepper motors with 1000-line optical encoders
#   - 6-wire encoder wiring: A+→A, B+→B, A-/B-/Common→GND, 5V→5V
#   - Brake resistors (MANDATORY — mount where they can safely dissipate heat)
#
# Key Differences from TMC2209/TMC5160:
#   - Full closed-loop FOC servo control in hardware
#   - Virtual steps: full_steps_per_rotation and microsteps have NO physical
#     relation to the motor — they are translated to position angles internally
#   - Recommended: 4096 steps × 2 microsteps (product must be < 65536)
#   - Sensorless homing is NOT currently functional — use physical endstops
#   - No autotune_tmc support — use TMC_TUNE_PID and TMC_TUNE_MOTION_PID
#   - current_scale_ma_lsb: 1.272 for Ouroboros (matches EVAL-BOB)
#   - run_current = peak current = 1.4 × rated motor current for steppers
#
# ==============================================================================

# ==============================================================================
# SECTION 1: OUROBOROS MCU DEFINITION
# ==============================================================================
# The Ouroboros board needs its own MCU running Klipper firmware.
# Flash Klipper to the Ouroboros STM32 controller.

[mcu ouroboros]
# ⚠️ CHANGE THIS to match your Ouroboros board's serial path
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_XXXXXXXXXXXXXXXXXXXX-if00
# Alternative: If using CAN bus instead of USB:
#canbus_uuid: XXXXXXXXXXXX

# ==============================================================================
# SECTION 2: X STEPPER (ACTIVE MOTOR - LEFT / B MOTOR)
# ==============================================================================
# Connected to Ouroboros Motor Channel 1
# ⚠️ Pin assignments below are EXAMPLES — verify against your wiring

[stepper_x]
step_pin: ouroboros:PB11                   # ⚠️ VERIFY: STEP signal to Ouroboros
dir_pin: ouroboros:PA0                     # ⚠️ VERIFY: DIR signal to Ouroboros
enable_pin: ouroboros:PE7                  # ⚠️ VERIFY: ENABLE signal to Ouroboros
rotation_distance: 40                      # Standard CoreXY belt drive
microsteps: 2                              # Virtual — servo handles positioning
full_steps_per_rotation: 4096              # Virtual — 4096×2 = 8192 < 65536
# ⚠️ IMPORTANT: Sensorless homing is NOT functional with TMC4671!
# You MUST use a physical endstop switch.
endstop_pin: ^PG6                          # ⚠️ Physical endstop on Octopus Pro
#endstop_pin: ^ouroboros:PEXX              # Alternative: endstop on Ouroboros
position_min: 0
position_endstop: 355
position_max: 355
homing_speed: 40                           # Slower than sensorless — physical switch
homing_retract_dist: 5                     # Retract after triggering endstop
homing_positive_dir: true

# ------------------------------------------------------------------------------
# TMC4671 Driver Configuration — X Axis (Ouroboros Channel 1)
# ------------------------------------------------------------------------------
# Reference: TMC4671 datasheet + Andrew's driver documentation
# Current scale: 1.272 for Ouroboros board
# Run current: Peak current = 1.4 × rated motor current
# LDO-42STH48-2504AC rated at 2.5A → peak = 3.5A

[tmc4671 stepper_x]
cs_pin: ouroboros:PA4                      # ⚠️ VERIFY: SPI chip select
spi_bus: spi1                              # ⚠️ VERIFY: Must be hardware SPI
spi_speed: 2000000                         # 2 MHz SPI clock
diag_pin: ouroboros:PE8                    # ⚠️ VERIFY: Status/diagnostic pin

# --- Current Configuration ---
current_scale_ma_lsb: 1.272                # Ouroboros-specific value
run_current: 3.5                           # Peak current (1.4 × 2.5A rated)

# --- FOC Motor Configuration ---
flux_current: 0.02                         # Flux holding current
foc_motor_type: 2                          # 2 = stepper motor
foc_n_pole_pairs: 50                       # 50 pole pairs for 200-step motor
foc_pwm_sv: 0                              # Space vector PWM mode

# --- ADC Channel Mapping ---
# ⚠️ These depend on which current sense channels your motor phases
# are connected to on the Ouroboros. Verify with board schematic.
foc_adc_i_ux_select: 0                    # Phase U current ADC channel
foc_adc_i_v_select: 2                     # Phase V current ADC channel
foc_adc_i_wy_select: 1                    # Phase W/Y current ADC channel

# --- Encoder Configuration ---
# LDO-42STH48-2504-E1000: 1000-line optical encoder = 4000 PPR (quadrature)
foc_abn_decoder_ppr: 4000                  # Pulses per revolution (4 × 1000 lines)
foc_abn_direction: 0                       # 0 = normal, 1 = inverted
foc_phi_e_selection: 3                     # 3 = ABN encoder for electrical angle
foc_position_selection: 9                  # 9 = ABN encoder for position
foc_velocity_selection: 9                  # 9 = ABN encoder for velocity

# --- PID Tuning (Current/Torque Loops) ---
# ⚠️ RUN TMC_TUNE_PID AFTER INSTALLATION to get YOUR values!
# These are starting values from the LDO 2504 example.
# For CoreXY: Use IDENTICAL flux/torque PID on BOTH X and Y motors.
foc_pid_flux_i: 0.485
foc_pid_flux_p: 9.66
foc_pid_torque_i: 0.485
foc_pid_torque_p: 9.66

# --- PID Tuning (Velocity/Position Loops) ---
# ⚠️ RUN TMC_TUNE_MOTION_PID AFTER current PID is tuned!
# Start with these conservative values, then autotune:
#   TMC_TUNE_MOTION_PID LAMBDA_V=80 LAMBDA_P=180 HOLDING_CURRENT=2.5 HOLDING_TORQUE=0.055 STEPPER=stepper_x
# If motors make noise at rest: increase Lambda values.
# For CoreXY: Use IDENTICAL velocity/position PID on BOTH motors.
foc_pid_velocity_i: 0.00826
foc_pid_velocity_p: 1.408
foc_pid_position_i: 0.00277
foc_pid_position_p: 2.82

# --- Biquad Digital Filters ---
# Tune AFTER PID is stable. Start at 0 (disabled), then:
# - Torque: ~1600 Hz for NEMA17 (hissing while moving = too high)
# - Flux: ~800 Hz (noise at rest = too low)
# - Velocity/Position: Usually not needed for 3D printing
biquad_flux_frequency: 0
biquad_torque_frequency: 0
biquad_velocity_frequency: 0
biquad_position_frequency: 0

# ==============================================================================
# SECTION 3: Y STEPPER (A MOTOR - RIGHT)
# ==============================================================================
# Connected to Ouroboros Motor Channel 2
# ⚠️ Pin assignments below are EXAMPLES — verify against your wiring

[stepper_y]
step_pin: ouroboros:PB12                   # ⚠️ VERIFY: STEP signal (Channel 2)
dir_pin: ouroboros:PA1                     # ⚠️ VERIFY: DIR signal (Channel 2)
enable_pin: ouroboros:PE9                  # ⚠️ VERIFY: ENABLE signal (Channel 2)
rotation_distance: 40                      # Standard CoreXY belt drive
microsteps: 2                              # Virtual — servo handles positioning
full_steps_per_rotation: 4096              # Virtual — 4096×2 = 8192 < 65536
endstop_pin: PG9                           # Physical endstop (same as original)
position_min: 0
position_endstop: 359
position_max: 359
homing_speed: 40                           # Physical endstop homing speed
homing_retract_dist: 5
homing_positive_dir: true

# ------------------------------------------------------------------------------
# TMC4671 Driver Configuration — Y Axis (Ouroboros Channel 2)
# ------------------------------------------------------------------------------
# ⚠️ CRITICAL for CoreXY: Flux/Torque/Velocity/Position PID values
# MUST be identical on both X and Y motors!

[tmc4671 stepper_y]
cs_pin: ouroboros:PA5                      # ⚠️ VERIFY: SPI chip select (Ch2)
spi_bus: spi1                              # ⚠️ VERIFY: Same SPI bus as Ch1
spi_speed: 2000000
diag_pin: ouroboros:PE10                   # ⚠️ VERIFY: Status pin (Ch2)

# --- Current Configuration ---
current_scale_ma_lsb: 1.272
run_current: 3.5

# --- FOC Motor Configuration ---
flux_current: 0.02
foc_motor_type: 2
foc_n_pole_pairs: 50
foc_pwm_sv: 0

# --- ADC Channel Mapping ---
foc_adc_i_ux_select: 0                    # ⚠️ VERIFY for Channel 2
foc_adc_i_v_select: 2
foc_adc_i_wy_select: 1

# --- Encoder Configuration ---
foc_abn_decoder_ppr: 4000
foc_abn_direction: 0
foc_phi_e_selection: 3
foc_position_selection: 9
foc_velocity_selection: 9

# --- PID Tuning (MUST match stepper_x for CoreXY!) ---
foc_pid_flux_i: 0.485
foc_pid_flux_p: 9.66
foc_pid_torque_i: 0.485
foc_pid_torque_p: 9.66
foc_pid_velocity_i: 0.00826
foc_pid_velocity_p: 1.408
foc_pid_position_i: 0.00277
foc_pid_position_p: 2.82

# --- Biquad Digital Filters ---
biquad_flux_frequency: 0
biquad_torque_frequency: 0
biquad_velocity_frequency: 0
biquad_position_frequency: 0

# ==============================================================================
# SECTION 4: TUNING REFERENCE
# ==============================================================================
# After installation, follow this tuning sequence:
#
# STEP 1: Autotune current/torque PID (do for EACH motor separately)
#   SET_STEPPER_ENABLE STEPPER=stepper_x
#   TMC_TUNE_PID STEPPER=stepper_x
#   SET_STEPPER_ENABLE STEPPER=stepper_y
#   TMC_TUNE_PID STEPPER=stepper_y
#   → Copy output values to BOTH foc_pid_flux and foc_pid_torque sections
#   → Use the SAME values for both X and Y (CoreXY requirement)
#
# STEP 2: Autotune velocity/position PID
#   TMC_TUNE_MOTION_PID LAMBDA_V=80 LAMBDA_P=180 HOLDING_CURRENT=2.5 HOLDING_TORQUE=0.055 STEPPER=stepper_x
#   TMC_TUNE_MOTION_PID LAMBDA_V=80 LAMBDA_P=180 HOLDING_CURRENT=2.5 HOLDING_TORQUE=0.055 STEPPER=stepper_y
#   → SAVE_CONFIG to persist values
#   → If motors make noise at rest: increase Lambda values
#   → If not noisy: try decreasing — minimum quiet value is likely optimal
#
# STEP 3: Tune biquad filters
#   Start with biquad_torque_frequency: 1600
#   Start with biquad_flux_frequency: 800
#   → Hissing while moving = frequency too high → decrease
#   → Noise at rest = frequency too low → increase
#   → Rounding corners at speed = flux frequency too low → increase
#
# STEP 4: Verify operation
#   - Manually move axes with G0 commands at low speed
#   - Check encoder feedback with TMC4671 status commands
#   - Gradually increase speed and verify tracking
#   - Run input shaper tests with ADXL345
#
# STEP 5: Toolchanger integration
#   - Verify tool changes work at reduced speed first
#   - Check Z-current boost macros still reference correct TMC type
#   - Test full print cycle with tool changes
#
# ==============================================================================
# NOTES ON TOOLCHANGER INTEGRATION
# ==============================================================================
# The Z-stepper current boost macros in toolchanger.cfg reference TMC5160:
#   SET_TMC_CURRENT STEPPER=stepper_z CURRENT=2.0
#   printer.configfile.settings['tmc5160 stepper_z'].run_current
# These remain UNCHANGED because Z-axis still uses TMC5160 drivers.
# Only X/Y axes are affected by this closed-loop upgrade.
# ==============================================================================

# ==============================================================================
# SECTION 5: CRASH DETECTION (EXPERIMENTAL)
# ==============================================================================
# Monitors position tracking error on X/Y to detect collisions.
# When the motor can't reach the commanded position (crash, belt skip,
# obstruction), the error between target and actual position grows.
# This module detects that and pauses the print.
#
# ⚠️ REQUIRES TUNING: The threshold depends on your motion system.
# Start with a high value (500+) and decrease until you get
# reliable detection without false positives during normal printing.
# Fast acceleration/deceleration causes momentary position errors
# that are NOT crashes — the threshold must be above those peaks.
#
# To find your baseline:
#   1. Print normally with crash detection in STATUS mode
#   2. Run TMC4671_CRASH_DETECT_STATUS during fast moves
#   3. Note the maximum position error during normal operation
#   4. Set threshold to ~2-3× that value
#
# [tmc4671_crash_detect]
# stepper_x: stepper_x
# stepper_y: stepper_y
# position_error_threshold: 200   # ⚠️ TUNE THIS for your machine
# check_interval: 0.1             # Check every 100ms
# consecutive_errors: 3           # 3 consecutive reads over threshold
# enabled_during_print: True      # Auto-enable when printing
# pause_on_error: True            # Pause print on crash detection
# ==============================================================================
