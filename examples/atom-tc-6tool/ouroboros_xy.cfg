# ==============================================================================
# EXPERIMENTAL: closed-loop X/Y with TMC4671 (Ouroboros board, Isik's Tech)
# Driver: https://github.com/andrewmcgr/tmc-4671  |  Guide: docs/CLOSED_LOOP_UPGRADE.md
#
# These are the values of the author's printer. Before use, check against
# YOUR hardware: pins and SPI bus, run_current (about 1.4 x rated current),
# encoder resolution, and tune PID with TMC_TUNE_PID / TMC_TUNE_MOTION_PID.
# Brake resistors are mandatory.
# The author's printer.cfg contains the same sections inline.
# ==============================================================================
# OUROBOROS CLOSED-LOOP X/Y — based on isiks.tech/Ouroboros/Stepper-Setup/
# ==============================================================================
# NOTE: [mcu ouroboros] and temperature sensors are defined in printer.cfg

[stepper_x]
step_pin: ouroboros:PD4
dir_pin: !ouroboros:PD3
enable_pin: !ouroboros:PD6
rotation_distance: 40
microsteps: 2
full_steps_per_rotation: 4096
endstop_pin: ^ouroboros:PD7
position_min: 0
position_endstop: 355
position_max: 355
homing_speed: 50
homing_retract_dist: 5
homing_positive_dir: true

[tmc4671 stepper_x]
cs_pin: ouroboros:PD0
spi_bus: spi2
spi_speed: 2000000
current_scale_ma_lsb: 1.272
run_current: 3.5
flux_current: 0.02
foc_motor_type: 2
foc_n_pole_pairs: 50
foc_pwm_sv: 0
foc_adc_i_ux_select: 0
foc_adc_i_v_select: 2
foc_adc_i_wy_select: 1
foc_phi_e_selection: 3
foc_position_selection: 9
foc_velocity_selection: 9
foc_abn_decoder_ppr: 4000
foc_abn_direction: 1
foc_pid_flux_p: 17.1
foc_pid_flux_i: 0.067
foc_pid_torque_p: 17.1
foc_pid_torque_i: 0.067
foc_pid_velocity_p: 1.07063
foc_pid_velocity_i: 0.00498
foc_pid_position_p: 1.27522
foc_pid_position_i: 0.00125
biquad_flux_frequency: 0
biquad_torque_frequency: 0
biquad_velocity_frequency: 0
biquad_position_frequency: 0

[stepper_y]
step_pin: ouroboros:PC12
dir_pin: !ouroboros:PC11
enable_pin: !ouroboros:PD1
rotation_distance: 40
microsteps: 2
full_steps_per_rotation: 4096
endstop_pin: ^PG9
position_min: 0
position_endstop: 361
position_max: 361
homing_speed: 50
homing_retract_dist: 5
homing_positive_dir: true

[tmc4671 stepper_y]
cs_pin: ouroboros:PD2
spi_bus: spi2
spi_speed: 2000000
current_scale_ma_lsb: 1.272
run_current: 3.5
flux_current: 0.02
foc_motor_type: 2
foc_n_pole_pairs: 50
foc_pwm_sv: 0
foc_adc_i_ux_select: 0
foc_adc_i_v_select: 2
foc_adc_i_wy_select: 1
foc_phi_e_selection: 3
foc_position_selection: 9
foc_velocity_selection: 9
foc_abn_decoder_ppr: 4000
foc_abn_direction: 1
foc_pid_flux_p: 17.1
foc_pid_flux_i: 0.067
foc_pid_torque_p: 17.1
foc_pid_torque_i: 0.067
foc_pid_velocity_p: 1.07063
foc_pid_velocity_i: 0.00498
foc_pid_position_p: 1.27522
foc_pid_position_i: 0.00125
biquad_flux_frequency: 0
biquad_torque_frequency: 0
biquad_velocity_frequency: 0
biquad_position_frequency: 0
