# ==============================================================================
# ATOM TC-6 — TOOL CALIBRATION MACROS
# ==============================================================================
#
# Author: PrintStructor
# GitHub: https://github.com/PrintStructor
#
# Description:
#   Complete calibration suite for the ATOM TC-6 toolchanger.
#   Supports three independent calibration methods:
#
#   • kTAMV    - Camera-based XY offset measurement (primary method)
#   • NUDGE    - Physical contact probe for XY offsets (backup method)
#   • Beacon   - Contact mode for Z offset measurement (primary method)
#
# ==============================================================================
# CALIBRATION METHODS OVERVIEW
# ==============================================================================
#
# ┌─────────────────────────────────────────────────────────────────┐
# │ kTAMV XY CALIBRATION (Camera-based)                            │
# ├─────────────────────────────────────────────────────────────────┤
# │ First time setup:                                              │
# │   1. Move tool manually over camera (nozzle centered in view)  │
# │   2. KTAMV_SET_ORIGIN            - Save camera position        │
# │                                                                 │
# │ Calibration workflow (step by step):                           │
# │   1. KTAMV_CAMERA_SETUP TOOL=0   - Setup camera + set origin   │
# │   2. KTAMV_CALIBRATE_XY INITIAL_TOOL=0   - Measure all tools   │
# │   3. SAVE_CONFIG                 - Persist to printer.cfg      │
# │                                                                 │
# │ Calibration workflow (all-in-one, full matrix):                │
# │   1. KTAMV_CALIBRATE_ALL_TOOLS_XY  - Each tool as initial      │
# │   2. SAVE_CONFIG                   - Persist to printer.cfg    │
# │   → T0→T1-T5, T1→T0,T2-T5, ... T5→T0-T4 (30 measurements)      │
# └─────────────────────────────────────────────────────────────────┘
#
# ┌─────────────────────────────────────────────────────────────────┐
# │ NUDGE XY CALIBRATION (Physical probe, 150°C required)          │
# ├─────────────────────────────────────────────────────────────────┤
# │ NUDGE_FIND_TOOL_OFFSETS INITIAL_TOOL=<0-5> [SKIP="2,3"]       │
# │ SAVE_CONFIG                                                     │
# │                                                                 │
# │ Hardware: [tools_calibrate], [filament_switch_sensor]          │
# └─────────────────────────────────────────────────────────────────┘
#
# ┌─────────────────────────────────────────────────────────────────┐
# │ BEACON Z CALIBRATION (Contact mode, 150°C required)            │
# ├─────────────────────────────────────────────────────────────────┤
# │ Single initial tool:                                           │
# │   BEACON_CALIBRATE_Z INITIAL_TOOL=<0-5>                        │
# │   SAVE_CONFIG                                                   │
# │                                                                 │
# │ Full matrix (all-in-one):                                      │
# │   BEACON_CALIBRATE_ALL_TOOLS_Z  - Each tool as initial         │
# │   SAVE_CONFIG                                                   │
# │   → T0→T1-T5, T1→T0,T2-T5, ... T5→T0-T4 (30 measurements)      │
# └─────────────────────────────────────────────────────────────────┘
#
# Runtime Z-Offset Adjustments:
#
# Global Z-Offset (affects ALL tools equally):
#   GLOBAL_Z_ADJUST Z=+0.01           - Adjust global offset
#   GLOBAL_Z_ADJUST Z=-0.01           - Adjust global offset
#   GLOBAL_Z_ADJUST RESET=1           - Reset to 0.0
#   GLOBAL_Z_ADJUST                   - Show current value
#
# Per-Tool Z-Offset (individual tool fine-tuning):
#   SET_TOOL_Z_ADJUST Z=+0.02         - Adjust current tool
#   SET_TOOL_Z_ADJUST TOOL=3 Z=-0.01  - Adjust specific tool
#   SET_TOOL_Z_ADJUST RESET=1         - Reset to calibrated value
#
# Mainsail/Fluidd Babystep Integration:
#   SET_GCODE_OFFSET Z_ADJUST=+0.02   - Babystep (saved per-tool)
#
# ==============================================================================


# ==============================================================================
# SECTION 1: CONFIG HELPER MODULE
# ==============================================================================

[tc_config_helper]
# Provides TC_SAVE_CONFIG_VALUE command for saving calibration results
# Used by all calibration macros to persist offsets to printer.cfg


# ==============================================================================
# SECTION 2: kTAMV XY CALIBRATION
# ==============================================================================

# ------------------------------------------------------------------------------
# kTAMV Calibration Macros (using official kTAMV commands)
# ------------------------------------------------------------------------------
#
# Official kTAMV commands used:
#   KTAMV_SEND_SERVER_CFG    - Configure server connection
#   KTAMV_CALIB_CAMERA       - Calibrate mm/pixel ratio
#   KTAMV_FIND_NOZZLE_CENTER - Center nozzle in camera view
#   KTAMV_SET_ORIGIN         - Set current position as reference
#   KTAMV_GET_OFFSET         - Measure offset from origin
#   printer.ktamv.camera_center_coordinates - Stored camera position
#   printer.ktamv.last_calculated_offset    - Last measured offset
#
# Workflow:
#   1. KTAMV_CAMERA_SETUP TOOL=0 - One-time camera setup with reference tool
#   2. KTAMV_CALIBRATE_XY        - Measure all tools
#   3. SAVE_CONFIG               - Save to printer.cfg
# ------------------------------------------------------------------------------

[gcode_macro KTAMV_CAMERA_SETUP]
description: Setup kTAMV camera and set origin with reference tool
# Prerequisite: Tool must be positioned approximately over camera!
# Workflow per kTAMV GitHub:
#   1. KTAMV_SEND_SERVER_CFG
#   2. KTAMV_CALIB_CAMERA (calibrates mm/pixel)
#   3. KTAMV_FIND_NOZZLE_CENTER (centers nozzle)
#   4. KTAMV_SET_ORIGIN (saves centered position as reference)
gcode:
    {% set TOOL = params.TOOL|default(0)|int %}

    # Enable calibration mode (disables offsets during calibration)
    SET_CALIBRATION_MODE ENABLE=1 XY=1
    STATUS_KTAMV

    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="  kTAMV CAMERA SETUP (T{TOOL})"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    # Step 1: Configure server
    RESPOND MSG="Step 1/4: Configuring server..."
    KTAMV_SEND_SERVER_CFG

    # Step 2: Calibrate camera (mm/pixel ratio)
    RESPOND MSG="Step 2/4: Calibrating camera (mm/pixel)..."
    KTAMV_CALIB_CAMERA

    # Step 3: Find and center nozzle
    RESPOND MSG="Step 3/4: Finding nozzle center..."
    KTAMV_FIND_NOZZLE_CENTER

    # Step 4: Set origin (after centering!)
    RESPOND MSG="Step 4/4: Setting origin..."
    KTAMV_SET_ORIGIN

    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="  kTAMV CAMERA SETUP COMPLETE!"
    RESPOND MSG="  Next: KTAMV_CALIBRATE_XY INITIAL_TOOL={TOOL}"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


[gcode_macro KTAMV_CALIBRATE_XY]
description: Measure XY offsets for all tools relative to initial tool
# Usage: KTAMV_CALIBRATE_XY INITIAL_TOOL=0
gcode:
    {% set INITIAL_TOOL = params.INITIAL_TOOL|default(0)|int %}
    {% set cam_pos = printer.ktamv.camera_center_coordinates|default(none) %}

    # Enable calibration mode (disables offsets during calibration)
    SET_CALIBRATION_MODE ENABLE=1 XY=1
    STATUS_KTAMV

    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="  kTAMV CALIBRATE XY"
    RESPOND MSG="  Reference: T{INITIAL_TOOL}"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    # Check camera position is set
    {% if cam_pos is none or cam_pos[0] is none %}
        SET_CALIBRATION_MODE ENABLE=0
        STATUS_READY
        RESPOND TYPE=error MSG="Camera position not set!"
        RESPOND MSG="Run KTAMV_CAMERA_SETUP TOOL={INITIAL_TOOL} first"
        {action_raise_error("Run KTAMV_CAMERA_SETUP first")}
    {% endif %}

    # Home if needed
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # Configure server
    KTAMV_SEND_SERVER_CFG

    # Measure each tool (0-5)
    {% for tool_num in range(6) %}
        {% if tool_num != INITIAL_TOOL %}
            RESPOND MSG=""
            RESPOND MSG="━━━ Measuring T{tool_num} ━━━"

            # Pick up tool
            T{tool_num}
            STATUS_KTAMV

            # Move to camera position
            G0 X{cam_pos[0]} Y{cam_pos[1]} F{printer.ktamv.move_speed|default(6000)}
            M400

            # Find nozzle center
            RESPOND MSG="Finding nozzle..."
            KTAMV_FIND_NOZZLE_CENTER

            # Get offset from origin
            RESPOND MSG="Measuring offset..."
            KTAMV_GET_OFFSET

            # Save offset
            {% set offset = printer.ktamv.last_calculated_offset|default([0,0]) %}
            RESPOND MSG="T{tool_num} offset: X={offset[0]} Y={offset[1]}"
            _KTAMV_SAVE_XY_OFFSET TOOL={tool_num} INITIAL_TOOL={INITIAL_TOOL}
        {% endif %}
    {% endfor %}

    # Disable calibration mode, restore LEDs
    SET_CALIBRATION_MODE ENABLE=0
    STATUS_READY

    RESPOND MSG=""
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="  CALIBRATION COMPLETE!"
    RESPOND MSG="  Run SAVE_CONFIG to persist offsets"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


# ------------------------------------------------------------------------------
# kTAMV Batch Calibration (All Tools)
# ------------------------------------------------------------------------------

[gcode_macro KTAMV_CALIBRATE_ALL_TOOLS_XY]
description: Complete XY calibration - each tool as initial, measure all others
# Usage: KTAMV_CALIBRATE_ALL_TOOLS_XY
# Workflow: T0 → setup → measure T1-T5, T1 → setup → measure T0,T2-T5, etc.
gcode:
    {% set cam_pos = printer.ktamv.camera_center_coordinates|default(none) %}

    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="  kTAMV FULL CALIBRATION (ALL TOOLS)"
    RESPOND MSG="  Each tool will be used as initial tool"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    # Enable calibration mode
    SET_CALIBRATION_MODE ENABLE=1 XY=1
    STATUS_KTAMV

    # Home if needed
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # Configure server once
    KTAMV_SEND_SERVER_CFG

    # Loop through each tool as INITIAL_TOOL
    {% for initial_tool in range(6) %}
        RESPOND MSG=""
        RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        RESPOND MSG="  INITIAL TOOL: T{initial_tool} ({initial_tool + 1}/6)"
        RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        # Pick up initial tool
        T{initial_tool}
        STATUS_KTAMV

        # Move to camera position (if known)
        {% if cam_pos is not none and cam_pos[0] is not none %}
            G0 X{cam_pos[0]} Y{cam_pos[1]} F{printer.ktamv.move_speed|default(6000)}
            M400
        {% endif %}

        # Camera setup for this initial tool
        RESPOND MSG="Calibrating camera..."
        KTAMV_CALIB_CAMERA

        RESPOND MSG="Finding nozzle center..."
        KTAMV_FIND_NOZZLE_CENTER

        RESPOND MSG="Setting origin for T{initial_tool}..."
        KTAMV_SET_ORIGIN

        # Get updated camera position
        {% set cam_pos_current = printer.ktamv.camera_center_coordinates %}

        # Measure all other tools relative to this initial tool
        {% for measure_tool in range(6) %}
            {% if measure_tool != initial_tool %}
                RESPOND MSG=""
                RESPOND MSG="━━━ T{initial_tool}→T{measure_tool}: Measuring ━━━"

                # Pick up tool to measure
                T{measure_tool}
                STATUS_KTAMV

                # Move to camera position
                G0 X{cam_pos_current[0]} Y{cam_pos_current[1]} F{printer.ktamv.move_speed|default(6000)}
                M400

                # Find nozzle center
                RESPOND MSG="Finding nozzle..."
                KTAMV_FIND_NOZZLE_CENTER

                # Get offset from origin
                RESPOND MSG="Measuring offset..."
                KTAMV_GET_OFFSET

                # Save offset
                {% set offset = printer.ktamv.last_calculated_offset|default([0,0]) %}
                RESPOND MSG="T{measure_tool} offset (from T{initial_tool}): X={offset[0]} Y={offset[1]}"
                _KTAMV_SAVE_XY_OFFSET TOOL={measure_tool} INITIAL_TOOL={initial_tool}
            {% endif %}
        {% endfor %}
    {% endfor %}

    # Return to T0
    T0

    # Disable calibration mode, restore LEDs
    SET_CALIBRATION_MODE ENABLE=0
    STATUS_READY

    RESPOND MSG=""
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="  FULL CALIBRATION COMPLETE!"
    RESPOND MSG="  All 6 tools calibrated as initial tools"
    RESPOND MSG="  30 offset measurements saved"
    RESPOND MSG="  Run SAVE_CONFIG to persist offsets"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


# ------------------------------------------------------------------------------
# kTAMV Single Tool Recalibration
# ------------------------------------------------------------------------------

[gcode_macro KTAMV_RECALIBRATE_TOOL]
description: Recalibrate XY for a single tool (camera must be set up already)
# Usage: KTAMV_RECALIBRATE_TOOL TOOL=<n> [HEAT=0] [HEAT_TEMP=150]
gcode:
    {% set TOOL = params.TOOL|int %}
    {% set INITIAL_TOOL = params.INITIAL_TOOL|default(0)|int %}
    {% set HEAT = params.HEAT|default(0)|int %}
    {% set HEAT_TEMP = params.HEAT_TEMP|default(150)|int %}

    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="Recalibrating T{TOOL}"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    # Check camera is calibrated
    {% set ktamv = printer.ktamv|default({}) %}
    {% if not ktamv.is_calibrated|default(false) %}
        RESPOND TYPE=error MSG="Camera not calibrated!"
        RESPOND MSG="Run KTAMV_CAMERA_SETUP first"
        {action_raise_error("kTAMV camera not calibrated")}
    {% endif %}

    # Enable calibration mode
    SET_CALIBRATION_MODE ENABLE=1 XY=1
    STATUS_KTAMV

    # Switch to tool
    T{TOOL}
    STATUS_KTAMV

    # Optional: Heat
    {% if HEAT == 1 %}
        RESPOND MSG="-> Heating T{TOOL} to {HEAT_TEMP}C..."
        M109 S{HEAT_TEMP}
    {% endif %}

    # Move to camera
    RESPOND MSG="-> Moving to camera..."
    KTAMV_MOVE_TO_CAMERA
    M400

    # Preview
    KTAMV_START_PREVIEW
    G4 P500

    # Find nozzle
    RESPOND MSG="-> Finding nozzle..."
    KTAMV_FIND_NOZZLE_CENTER

    # Get offset
    RESPOND MSG="-> Calculating offset..."
    KTAMV_GET_OFFSET

    # Check and save
    _KTAMV_CHECK_RESULT TOOL={TOOL}
    _KTAMV_SAVE_XY_OFFSET TOOL={TOOL} INITIAL_TOOL={INITIAL_TOOL}

    # Cool down if heated
    {% if HEAT == 1 %}
        M104 T{TOOL} S0
    {% endif %}

    # Disable calibration mode
    SET_CALIBRATION_MODE ENABLE=0
    STATUS_READY

    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="T{TOOL} recalibrated!"
    RESPOND MSG="Run SAVE_CONFIG to persist"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


# ------------------------------------------------------------------------------
# kTAMV Abort Calibration
# ------------------------------------------------------------------------------

[gcode_macro KTAMV_ABORT]
description: Emergency stop - abort calibration
gcode:
    RESPOND TYPE=error MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND TYPE=error MSG="CALIBRATION ABORTED!"
    RESPOND TYPE=error MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    # Disable calibration mode
    SET_CALIBRATION_MODE ENABLE=0

    # Cool down all tools
    {% for t in range(6) %}
        M104 T{t} S0
    {% endfor %}

    # Restore LEDs
    STATUS_READY

    RESPOND MSG="-> Calibration mode OFF"
    RESPOND MSG="-> All heaters OFF"
    RESPOND MSG="-> LEDs restored"


# ------------------------------------------------------------------------------
# kTAMV Internal Helper Macros
# ------------------------------------------------------------------------------


[gcode_macro _KTAMV_CHECK_RESULT]
gcode:
    {% set TOOL = params.TOOL|int %}
    {% set ktamv = printer.ktamv|default({}) %}
    {% set success = ktamv.last_nozzle_center_successful|default("false")|lower == "true" %}

    {% if success %}
        RESPOND MSG="  T{TOOL} nozzle found OK"
    {% else %}
        RESPOND TYPE=error MSG="  T{TOOL} nozzle detection FAILED!"
    {% endif %}


[gcode_macro _KTAMV_SAVE_XY_OFFSET]
gcode:
    {% set TOOL = params.TOOL|int %}
    {% set INITIAL_TOOL = params.INITIAL_TOOL|int %}
    {% set ktamv = printer.ktamv|default({}) %}
    {% set MAX_OFFSET = 2.0 %}

    {% set detection_ok = ktamv.last_nozzle_center_successful|default("false")|lower == "true" %}

    {% if not detection_ok %}
        RESPOND TYPE=error MSG="  T{TOOL}: Detection failed - NOT saved"
    {% elif ktamv.last_calculated_offset is defined %}
        {% set x_offset = ktamv.last_calculated_offset[0] %}
        {% set y_offset = ktamv.last_calculated_offset[1] %}

        {% if x_offset|abs > MAX_OFFSET or y_offset|abs > MAX_OFFSET %}
            RESPOND TYPE=error MSG="  T{TOOL}: Offset too large! X={x_offset|round(4)} Y={y_offset|round(4)}"
            RESPOND MSG="  -> NOT saved (check camera)"
        {% else %}
            RESPOND MSG="  T{TOOL} offset: X={x_offset|round(4)} Y={y_offset|round(4)}"
            SAVE_TOOL_XY_OFFSET TOOL={TOOL} X={x_offset} Y={y_offset} INITIAL_TOOL={INITIAL_TOOL}
        {% endif %}
    {% else %}
        RESPOND TYPE=error MSG="  T{TOOL}: No offset data"
    {% endif %}


# ==============================================================================
# SECTION 3: NUDGE XY CALIBRATION (Backup Method)
# ==============================================================================
# Physical contact probe for XY offset measurement
# Use when kTAMV camera is unavailable or for verification

# ------------------------------------------------------------------------------
# NUDGE Hardware Configuration
# ------------------------------------------------------------------------------

[tools_calibrate]
# NUDGE probe configuration
pin: PG10
spread: 4
lower_z: 0.2
travel_speed: 100
speed: 1.5
lift_speed: 4
final_lift_z: 6
sample_retract_dist: 2
samples_tolerance: 0.05
samples: 3
samples_result: median
trigger_to_bottom_z: 3

[filament_switch_sensor nudge_tool]
# Filament sensor for NUDGE probe (shared pin)
switch_pin: PG10
pause_on_runout: false

[gcode_macro NUDGE_MOVE_OVER_PROBE]
description: Move to NUDGE probe location
gcode:
    G0 X127.552 F9000
    G0 Y354.373 F9000
    G0 Z1.50


# ------------------------------------------------------------------------------
# NUDGE Calibration Macros
# ------------------------------------------------------------------------------

[gcode_macro NUDGE_FIND_TOOL_OFFSET]
description: Calibrate XY offset for currently active tool (single tool)
gcode:
    NUDGE_MOVE_OVER_PROBE
    TOOL_LOCATE_SENSOR


[gcode_macro NUDGE_FIND_TOOL_OFFSETS]
description: Calibrate XY offsets for all tools using NUDGE probe
# Usage: NUDGE_FIND_TOOL_OFFSETS INITIAL_TOOL=<0-5> [SKIP="2,3"] [RETURN=1]
gcode:
    {% set INITIAL_TOOL = params.INITIAL_TOOL|default(0)|int %}
    {% set PROBE_TEMP = 150 %}
    {% set TEMP_TOLERANCE = 5 %}
    {% set SKIP_TOOLS = params.SKIP|default("")|string %}
    {% set skip_list = SKIP_TOOLS.split(",") %}
    {% set RETURN_TO_INITIAL = params.RETURN|default(0)|int %}
    {% set BED_CENTER_X = 177.5 %}
    {% set BED_CENTER_Y = 177.5 %}
    {% set MAX_TOOLS = printer.toolchanger.params_max_tool_count|default(6)|int %}

    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="  NUDGE XY Calibration"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="Reference Tool: T{INITIAL_TOOL}"

    # Reset global_z_offset for clean calibration
    {% set old_global_offset = printer["gcode_macro globals"].global_z_offset|float %}
    SET_GCODE_VARIABLE MACRO=globals VARIABLE=global_z_offset VALUE=0.00
    RESPOND TYPE=echo MSG="Global Z-offset reset: {old_global_offset} → 0.00"

    CHECK_HOMING
    G90
    G0 Z10 F1000

    # Switch to initial tool
    {% if printer.toolchanger.tool %}
        {% if printer.toolchanger.tool.tool_number == INITIAL_TOOL %}
            G0 X{BED_CENTER_X} Y{BED_CENTER_Y} F6000
        {% else %}
            G0 X{BED_CENTER_X} Y{BED_CENTER_Y} F6000
            T{INITIAL_TOOL}
        {% endif %}
    {% else %}
        T{INITIAL_TOOL}
    {% endif %}

    # Heat initial tool
    M109 S{PROBE_TEMP} T{INITIAL_TOOL}

    # Locate sensor with initial tool
    NUDGE_MOVE_OVER_PROBE
    TOOL_LOCATE_SENSOR
    SET_GCODE_OFFSET X=0 Y=0

    # Calibrate all other tools
    {% for tool in range(MAX_TOOLS) %}
        {% if tool != INITIAL_TOOL and tool|string not in skip_list %}
            G0 Z10 F1000
            G0 X{BED_CENTER_X} Y{BED_CENTER_Y} F6000

            T{tool}

            M104 S{PROBE_TEMP} T{tool}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={PROBE_TEMP - TEMP_TOLERANCE} MAXIMUM={PROBE_TEMP + TEMP_TOLERANCE}

            NUDGE_MOVE_OVER_PROBE
            TOOL_CALIBRATE_TOOL_OFFSET
            G4 P500
        {% endif %}
    {% endfor %}

    # Finish
    G0 Z10 F1000
    G0 X{BED_CENTER_X} Y{BED_CENTER_Y} F6000
    TURN_OFF_HEATERS

    {% if RETURN_TO_INITIAL == 1 %}
        T{INITIAL_TOOL}
    {% endif %}

    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="NUDGE XY Calibration Complete!"
    RESPOND MSG="Run SAVE_CONFIG to persist"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


# ==============================================================================
# SECTION 4: BEACON Z CALIBRATION
# ==============================================================================

[gcode_macro BEACON_CALIBRATE_Z]
description: Measure Z-offsets between tools using Beacon contact detection
# Usage: BEACON_CALIBRATE_Z INITIAL_TOOL=<0-5>
variable_initial_tool: 0
variable_reference_z: 0.0
gcode:
    {% set INITIAL_TOOL = params.INITIAL_TOOL|default(0)|int %}
    {% set PROBE_TEMP = 150 %}
    {% set TEMP_TOLERANCE = 5 %}
    {% set X_POS = 177.5 %}
    {% set Y_POS = 177.5 %}

    # Store initial tool
    SET_GCODE_VARIABLE MACRO=BEACON_CALIBRATE_Z VARIABLE=initial_tool VALUE={INITIAL_TOOL}
    SAVE_VARIABLE VARIABLE=z_offset_reference_tool VALUE={INITIAL_TOOL}

    # Reset global_z_offset for clean calibration
    {% set current_global = printer["gcode_macro globals"].global_z_offset|float %}
    {% if current_global != 0.0 %}
        SET_GCODE_VARIABLE MACRO=globals VARIABLE=global_z_offset VALUE=0.00
        RESPOND TYPE=echo MSG="WARNING: Global Z-offset was {current_global}, reset to 0.00"
    {% else %}
        RESPOND TYPE=echo MSG="Global Z-offset is 0.00 - ready for calibration"
    {% endif %}

    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="  Beacon Z-Offset Calibration"
    RESPOND MSG="  Reference Tool: T{INITIAL_TOOL} | Temp: {PROBE_TEMP}°C"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    # Enable calibration mode
    SET_GCODE_VARIABLE MACRO=globals VARIABLE=toolchanger_calibration_mode VALUE=1
    {% set toolchanger = printer.toolchanger %}
    {% if toolchanger %}
        SET_CALIBRATION_MODE ENABLE=1
    {% endif %}

    SET_GCODE_VARIABLE MACRO=globals VARIABLE=current_tool VALUE={INITIAL_TOOL}

    G90
    G0 Z10 F1000

    # Initial tool setup
    T{INITIAL_TOOL}
    {% if INITIAL_TOOL == 0 %}
        {% set sensor_name = "extruder" %}
    {% else %}
        {% set sensor_name = "extruder" ~ INITIAL_TOOL %}
    {% endif %}
    {% if INITIAL_TOOL == 0 %}
        M109 S{PROBE_TEMP}
    {% else %}
        M109 S{PROBE_TEMP} T{INITIAL_TOOL}
    {% endif %}
    TEMPERATURE_WAIT SENSOR={sensor_name} MINIMUM={PROBE_TEMP - TEMP_TOLERANCE} MAXIMUM={PROBE_TEMP + TEMP_TOLERANCE}

    SET_GCODE_OFFSET Z=0 MOVE=1

    # Move to bed center
    G0 X{X_POS} Y{Y_POS} F5000

    # Measure reference
    RESPOND MSG="Measuring initial tool T{INITIAL_TOOL} as reference..."
    BEACON_OFFSET_COMPARE SAMPLES=10
    _STORE_Z_REFERENCE

    # Save initial tool with 0.0 offset (important for babystepping)
    SAVE_VARIABLE VARIABLE=tool_z_offset_t{INITIAL_TOOL} VALUE=0.0
    {% set tool_section = "tool T" ~ INITIAL_TOOL %}
    TC_SAVE_CONFIG_VALUE SECTION="{tool_section}" OPTION="t{INITIAL_TOOL}_z_offset" VALUE="0.0"

    RESPOND MSG="T{INITIAL_TOOL} is the reference (Z-offset = 0.0000)"
    G0 Z10 F1000

    # Measure all other tools
    _MEASURE_SINGLE_TOOL_Z TOOL=1 INITIAL_TOOL={INITIAL_TOOL} PROBE_TEMP={PROBE_TEMP} X_POS={X_POS} Y_POS={Y_POS}
    _MEASURE_SINGLE_TOOL_Z TOOL=2 INITIAL_TOOL={INITIAL_TOOL} PROBE_TEMP={PROBE_TEMP} X_POS={X_POS} Y_POS={Y_POS}
    _MEASURE_SINGLE_TOOL_Z TOOL=3 INITIAL_TOOL={INITIAL_TOOL} PROBE_TEMP={PROBE_TEMP} X_POS={X_POS} Y_POS={Y_POS}
    _MEASURE_SINGLE_TOOL_Z TOOL=4 INITIAL_TOOL={INITIAL_TOOL} PROBE_TEMP={PROBE_TEMP} X_POS={X_POS} Y_POS={Y_POS}
    _MEASURE_SINGLE_TOOL_Z TOOL=5 INITIAL_TOOL={INITIAL_TOOL} PROBE_TEMP={PROBE_TEMP} X_POS={X_POS} Y_POS={Y_POS}

    # Finalization
    G0 Z10 F1000
    T{INITIAL_TOOL}
    TURN_OFF_HEATERS

    # Disable calibration mode
    SET_CALIBRATION_MODE ENABLE=0
    SET_GCODE_VARIABLE MACRO=globals VARIABLE=toolchanger_calibration_mode VALUE=0

    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="Z-Offset Calibration Complete!"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    _SHOW_Z_OFFSET_RESULTS
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    M117 Calibration complete!


# ------------------------------------------------------------------------------
# BEACON Batch Calibration (All Tools)
# ------------------------------------------------------------------------------

[gcode_macro BEACON_CALIBRATE_ALL_TOOLS_Z]
description: Complete Z calibration - each tool as initial, measure all others
# Usage: BEACON_CALIBRATE_ALL_TOOLS_Z
# Workflow: T0 → ref → measure T1-T5, T1 → ref → measure T0,T2-T5, etc.
variable_current_initial_tool: 0
variable_reference_z: 0.0
gcode:
    {% set PROBE_TEMP = 150 %}
    {% set TEMP_TOLERANCE = 5 %}
    {% set X_POS = 177.5 %}
    {% set Y_POS = 177.5 %}

    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="  BEACON FULL Z CALIBRATION (ALL TOOLS)"
    RESPOND MSG="  Each tool will be used as initial tool"
    RESPOND MSG="  Temperature: {PROBE_TEMP}°C"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    # Reset global_z_offset for clean calibration
    {% set current_global = printer["gcode_macro globals"].global_z_offset|float %}
    {% if current_global != 0.0 %}
        SET_GCODE_VARIABLE MACRO=globals VARIABLE=global_z_offset VALUE=0.00
        RESPOND TYPE=echo MSG="WARNING: Global Z-offset was {current_global}, reset to 0.00"
    {% endif %}

    # Enable calibration mode
    SET_GCODE_VARIABLE MACRO=globals VARIABLE=toolchanger_calibration_mode VALUE=1
    {% set toolchanger = printer.toolchanger %}
    {% if toolchanger %}
        SET_CALIBRATION_MODE ENABLE=1
    {% endif %}

    G90
    G0 Z10 F1000

    # Loop through each tool as INITIAL_TOOL
    {% for initial_tool in range(6) %}
        RESPOND MSG=""
        RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        RESPOND MSG="  INITIAL TOOL: T{initial_tool} ({initial_tool + 1}/6)"
        RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        # Store current initial tool
        SET_GCODE_VARIABLE MACRO=BEACON_CALIBRATE_ALL_TOOLS_Z VARIABLE=current_initial_tool VALUE={initial_tool}

        # Pick up and heat initial tool
        T{initial_tool}

        {% if initial_tool == 0 %}
            {% set sensor_name = "extruder" %}
            M109 S{PROBE_TEMP}
        {% else %}
            {% set sensor_name = "extruder" ~ initial_tool %}
            M109 S{PROBE_TEMP} T{initial_tool}
        {% endif %}
        TEMPERATURE_WAIT SENSOR={sensor_name} MINIMUM={PROBE_TEMP - TEMP_TOLERANCE} MAXIMUM={PROBE_TEMP + TEMP_TOLERANCE}

        SET_GCODE_OFFSET Z=0 MOVE=1

        # Move to measurement position
        G0 X{X_POS} Y{Y_POS} F5000

        # Measure reference Z for this initial tool
        RESPOND MSG="Measuring T{initial_tool} as reference..."
        BEACON_OFFSET_COMPARE SAMPLES=10

        # Store reference Z
        {% set ref_z = printer.beacon.last_offset_result.position[2]|float %}
        SET_GCODE_VARIABLE MACRO=BEACON_CALIBRATE_ALL_TOOLS_Z VARIABLE=reference_z VALUE={ref_z}
        RESPOND MSG="  Reference Z: {ref_z|round(6)} mm"

        # Save initial tool with 0.0 offset (important for babystepping)
        SAVE_VARIABLE VARIABLE=tool_z_offset_t{initial_tool}_t{initial_tool} VALUE=0.0
        {% set tool_section = "tool T" ~ initial_tool %}
        TC_SAVE_CONFIG_VALUE SECTION="{tool_section}" OPTION="t{initial_tool}_z_offset" VALUE="0.0"
        RESPOND MSG="  T{initial_tool} Z-offset: 0.0000 mm (reference)"

        G0 Z10 F1000

        # Measure all other tools relative to this initial tool
        {% for measure_tool in range(6) %}
            {% if measure_tool != initial_tool %}
                RESPOND MSG=""
                RESPOND MSG="━━━ T{initial_tool}→T{measure_tool}: Measuring ━━━"

                G0 Z10 F1000
                T{measure_tool}

                # Heat tool
                {% if measure_tool == 0 %}
                    {% set m_sensor = "extruder" %}
                    M109 S{PROBE_TEMP}
                {% else %}
                    {% set m_sensor = "extruder" ~ measure_tool %}
                    M109 S{PROBE_TEMP} T{measure_tool}
                {% endif %}
                TEMPERATURE_WAIT SENSOR={m_sensor} MINIMUM={PROBE_TEMP - TEMP_TOLERANCE} MAXIMUM={PROBE_TEMP + TEMP_TOLERANCE}

                G0 X{X_POS} Y{Y_POS} F5000

                # Measure
                BEACON_OFFSET_COMPARE SAMPLES=10

                # Calculate and save offset
                {% set measured_z = printer.beacon.last_offset_result.position[2]|float %}
                {% set z_offset = measured_z - ref_z %}
                {% set z_offset_um = (z_offset * 1000)|round(1) %}

                RESPOND MSG="  Measured Z: {measured_z|round(6)} mm"
                RESPOND MSG="  → Z-Offset T{measure_tool} (from T{initial_tool}): {z_offset|round(4)} mm ({z_offset_um}µm)"

                # Save to variables and config
                SAVE_VARIABLE VARIABLE=tool_z_offset_t{initial_tool}_t{measure_tool} VALUE={z_offset}
                {% set tool_section = "tool T" ~ initial_tool %}
                TC_SAVE_CONFIG_VALUE SECTION="{tool_section}" OPTION="t{measure_tool}_z_offset" VALUE="{z_offset|round(4)}"

                G0 Z10 F1000
            {% endif %}
        {% endfor %}
    {% endfor %}

    # Finalization
    G0 Z10 F1000
    T0
    TURN_OFF_HEATERS

    # Disable calibration mode
    SET_CALIBRATION_MODE ENABLE=0
    SET_GCODE_VARIABLE MACRO=globals VARIABLE=toolchanger_calibration_mode VALUE=0

    RESPOND MSG=""
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="  FULL Z CALIBRATION COMPLETE!"
    RESPOND MSG="  All 6 tools calibrated as initial tools"
    RESPOND MSG="  30 Z-offset measurements saved"
    RESPOND MSG="  Run SAVE_CONFIG to persist offsets"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    M117 Full Z calibration complete!


[gcode_macro _STORE_Z_REFERENCE]
gcode:
    {% set last_z = printer.beacon.last_offset_result.position[2]|float %}
    SET_GCODE_VARIABLE MACRO=BEACON_CALIBRATE_Z VARIABLE=reference_z VALUE={last_z}
    RESPOND MSG="  Reference Z: {last_z|round(6)} mm"


[gcode_macro _MEASURE_SINGLE_TOOL_Z]
gcode:
    {% set TOOL = params.TOOL|int %}
    {% set INITIAL_TOOL = params.INITIAL_TOOL|int %}
    {% set PROBE_TEMP = params.PROBE_TEMP|default(150)|int %}
    {% set TEMP_TOLERANCE = 5 %}
    {% set X_POS = params.X_POS|default(177.5)|float %}
    {% set Y_POS = params.Y_POS|default(177.5)|float %}

    {% if TOOL == INITIAL_TOOL %}
        RESPOND MSG="Skipping T{TOOL} (initial tool)"
    {% else %}
        RESPOND MSG="━━━ Calibrating T{TOOL} ━━━"

        G0 Z10 F1000
        T{TOOL}

        {% if TOOL == 0 %}
            {% set sensor_name = "extruder" %}
            M109 S{PROBE_TEMP}
        {% else %}
            {% set sensor_name = "extruder" ~ TOOL %}
            M109 S{PROBE_TEMP} T{TOOL}
        {% endif %}
        TEMPERATURE_WAIT SENSOR={sensor_name} MINIMUM={PROBE_TEMP - TEMP_TOLERANCE} MAXIMUM={PROBE_TEMP + TEMP_TOLERANCE}

        G0 X{X_POS} Y{Y_POS} F5000

        BEACON_OFFSET_COMPARE SAMPLES=10
        _STORE_TOOL_Z_OFFSET TOOL={TOOL}

        G0 Z10 F1000
    {% endif %}


[gcode_macro _STORE_TOOL_Z_OFFSET]
gcode:
    {% set TOOL = params.TOOL|int %}
    {% set reference_z = printer["gcode_macro BEACON_CALIBRATE_Z"].reference_z|float %}
    {% set initial_tool = printer["gcode_macro BEACON_CALIBRATE_Z"].initial_tool|int %}

    {% set measured_z = printer.beacon.last_offset_result.position[2]|float %}
    {% set z_offset = measured_z - reference_z %}
    {% set z_offset_um = (z_offset * 1000)|round(1) %}

    RESPOND MSG="  Measured Z: {measured_z|round(6)} mm"
    RESPOND MSG="  Reference Z: {reference_z|round(6)} mm"
    RESPOND MSG="  → Z-Offset T{TOOL}: {z_offset|round(4)} mm ({z_offset_um}µm)"

    SAVE_VARIABLE VARIABLE=tool_z_offset_t{TOOL} VALUE={z_offset}

    {% set tool_section = "tool T" ~ initial_tool %}
    TC_SAVE_CONFIG_VALUE SECTION="{tool_section}" OPTION="t{TOOL}_z_offset" VALUE="{z_offset|round(4)}"


[gcode_macro _SHOW_Z_OFFSET_RESULTS]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set initial_tool = svv.z_offset_reference_tool|default(0)|int %}

    RESPOND MSG="Calibrated Z-Offsets (relative to T{initial_tool}):"
    RESPOND MSG="  T{initial_tool}: 0.0000 mm (reference)"

    {% for i in range(6) %}
        {% if i != initial_tool %}
            {% set var_name = "tool_z_offset_t" ~ i %}
            {% set offset = svv[var_name]|default(0)|float %}
            {% set offset_um = (offset * 1000)|round(1) %}
            RESPOND MSG="  T{i}: {offset|round(4)} mm ({offset_um}µm)"
        {% endif %}
    {% endfor %}


# ==============================================================================
# SECTION 5: Z-OFFSET RUNTIME ADJUSTMENTS
# ==============================================================================

[gcode_macro GLOBAL_Z_ADJUST]
description: Adjust global Z-offset (affects ALL tools equally)
gcode:
    {% set current_global = printer["gcode_macro globals"].global_z_offset|float %}

    {% if params.RESET is defined and params.RESET|int == 1 %}
        SET_GCODE_VARIABLE MACRO=globals VARIABLE=global_z_offset VALUE=0.0
        RESPOND MSG="Global Z-offset reset to 0.0 mm"
        {% set new_global = 0.0 %}
    {% elif params.Z is defined %}
        {% set adjustment = params.Z|float %}
        {% set new_global = current_global + adjustment %}
        SET_GCODE_VARIABLE MACRO=globals VARIABLE=global_z_offset VALUE={new_global}
        {% set adj_um = (adjustment * 1000)|round(1) %}
        {% set new_um = (new_global * 1000)|round(1) %}
        RESPOND MSG="Global Z-offset: {current_global|round(4)} → {new_global|round(4)} mm ({'+' if adjustment > 0 else ''}{adj_um}µm)"
    {% else %}
        {% set global_um = (current_global * 1000)|round(1) %}
        RESPOND MSG="Global Z-offset: {current_global|round(4)} mm ({global_um}µm)"
    {% endif %}

    {% if printer.toolchanger.tool_number >= 0 and (params.Z is defined or params.RESET is defined) %}
        {% set tool_num = printer.toolchanger.tool_number %}
        {% set initial_tool = printer.toolchanger.initial_tool %}
        {% if initial_tool and tool_num != initial_tool.tool_number %}
            {% set tool_z = initial_tool.z_offsets[tool_num]|default(0)|float %}
            {% set total = tool_z + new_global %}
            _BASE_SET_GCODE_OFFSET Z={total} MOVE=1
        {% else %}
            _BASE_SET_GCODE_OFFSET Z={new_global} MOVE=1
        {% endif %}
    {% endif %}


[gcode_macro Z_ADJUST_RESET]
description: Reset current tool's Z adjustment to calibrated value
gcode:
    SET_TOOL_Z_ADJUST RESET=1


[gcode_macro RESET_ALL_TOOL_Z_ADJUSTMENTS]
description: Reset all tool Z adjustments to calibrated values
gcode:
    {% for i in range(6) %}
        SET_TOOL_Z_ADJUST TOOL={i} RESET=1
    {% endfor %}
    RESPOND MSG="All tool Z-adjustments reset to calibrated values"


# ==============================================================================
# SECTION 6: SET_GCODE_OFFSET OVERRIDE (Mainsail/Fluidd Babystep Integration)
# ==============================================================================

[gcode_macro SET_GCODE_OFFSET]
description: Overrides default SET_GCODE_OFFSET to handle per-tool Z babystepping
rename_existing: _BASE_SET_GCODE_OFFSET
gcode:
    {% if params.Z_ADJUST is defined %}
        {% set z_adj = params.Z_ADJUST|float %}
        SET_TOOL_Z_ADJUST Z={z_adj}
    {% else %}
        {% set cmd = "_BASE_SET_GCODE_OFFSET" %}
        {% if params.X is defined %}
            {% set cmd = cmd ~ " X=" ~ params.X %}
        {% endif %}
        {% if params.Y is defined %}
            {% set cmd = cmd ~ " Y=" ~ params.Y %}
        {% endif %}
        {% if params.Z is defined %}
            {% set cmd = cmd ~ " Z=" ~ params.Z %}
        {% endif %}
        {% if params.X_ADJUST is defined %}
            {% set cmd = cmd ~ " X_ADJUST=" ~ params.X_ADJUST %}
        {% endif %}
        {% if params.Y_ADJUST is defined %}
            {% set cmd = cmd ~ " Y_ADJUST=" ~ params.Y_ADJUST %}
        {% endif %}
        {% if params.MOVE is defined %}
            {% set cmd = cmd ~ " MOVE=" ~ params.MOVE %}
        {% endif %}
        {% if params.MOVE_SPEED is defined %}
            {% set cmd = cmd ~ " MOVE_SPEED=" ~ params.MOVE_SPEED %}
        {% endif %}
        {cmd}
    {% endif %}
