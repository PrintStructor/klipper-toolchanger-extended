# ==============================================================================
# OUROBOROS FOC — Input Shaper Measurement Macros
# ==============================================================================
# Problem: The TMC4671 position/velocity PID actively suppresses resonances
# during measurement, resulting in 50x weaker ADXL signal and inflated ζ
# (apparent damping ratio). This causes poor MZV filter quality.
#
# Solution: Temporarily reduce position/velocity gains to near-zero before
# the resonance test. The motor still executes test moves (flux/torque loop
# is untouched) but resonances ring freely instead of being damped.
# After the test, all values are restored.
#
# Usage:
#   TEST_RESONANCES_FOC AXIS=X
#   TEST_RESONANCES_FOC AXIS=Y
#   SHAPER_CALIBRATE_FOC AXIS=X
#   SHAPER_CALIBRATE_FOC AXIS=Y
#   SHAPER_CALIBRATE_FOC             # both axes
#
# Manual mode (if you need to run your own commands in between):
#   FOC_MEASUREMENT_MODE             # switch to measurement mode
#   ... run TEST_RESONANCES or SHAPER_CALIBRATE manually ...
#   FOC_NORMAL_MODE                  # restore normal operation
# ==============================================================================

# ------------------------------------------------------------------------------
# Current normal-mode PID values (must match #*# SAVE_CONFIG section)
# Update these if you retune PIDs.
# ------------------------------------------------------------------------------
[gcode_macro _FOC_PID_NORMAL]
variable_velocity_p: 1.07063
variable_velocity_i: 0.00498
variable_position_p: 1.27522
variable_position_i: 0.00125
gcode:
    # This macro stores the restore values as variables.
    # It is called by FOC_NORMAL_MODE — do not call directly.

# ------------------------------------------------------------------------------
# FOC_MEASUREMENT_MODE
# Reduces position/velocity PID gains to allow resonances to ring freely.
# Flux/torque loop (current control) stays at full gain — motor still moves.
# ------------------------------------------------------------------------------
[gcode_macro FOC_MEASUREMENT_MODE]
gcode:
    RESPOND TYPE=echo MSG="FOC: switching to measurement mode (reduced position/velocity PID)"
    # Stepper X — ca. 1/4 der Normalgains, Motor kann noch folgen aber dämpft weniger
    SET_TMC_FIELD STEPPER=stepper_x FIELD=PID_POSITION_P FVAL=0.05
    SET_TMC_FIELD STEPPER=stepper_x FIELD=PID_POSITION_I FVAL=0
    SET_TMC_FIELD STEPPER=stepper_x FIELD=PID_VELOCITY_P FVAL=0.05
    SET_TMC_FIELD STEPPER=stepper_x FIELD=PID_VELOCITY_I FVAL=0
    # Stepper Y
    SET_TMC_FIELD STEPPER=stepper_y FIELD=PID_POSITION_P FVAL=0.05
    SET_TMC_FIELD STEPPER=stepper_y FIELD=PID_POSITION_I FVAL=0
    SET_TMC_FIELD STEPPER=stepper_y FIELD=PID_VELOCITY_P FVAL=0.05
    SET_TMC_FIELD STEPPER=stepper_y FIELD=PID_VELOCITY_I FVAL=0
    G4 P200
    RESPOND TYPE=echo MSG="FOC: measurement mode active"

# ------------------------------------------------------------------------------
# FOC_NORMAL_MODE
# Restores position/velocity PID gains to normal operating values.
# ------------------------------------------------------------------------------
[gcode_macro FOC_NORMAL_MODE]
gcode:
    {% set v = printer["gcode_macro _FOC_PID_NORMAL"] %}
    RESPOND TYPE=echo MSG="FOC: restoring normal PID gains"
    # Stepper X
    SET_TMC_FIELD STEPPER=stepper_x FIELD=PID_POSITION_P FVAL={v.position_p}
    SET_TMC_FIELD STEPPER=stepper_x FIELD=PID_POSITION_I FVAL={v.position_i}
    SET_TMC_FIELD STEPPER=stepper_x FIELD=PID_VELOCITY_P FVAL={v.velocity_p}
    SET_TMC_FIELD STEPPER=stepper_x FIELD=PID_VELOCITY_I FVAL={v.velocity_i}
    # Stepper Y
    SET_TMC_FIELD STEPPER=stepper_y FIELD=PID_POSITION_P FVAL={v.position_p}
    SET_TMC_FIELD STEPPER=stepper_y FIELD=PID_POSITION_I FVAL={v.position_i}
    SET_TMC_FIELD STEPPER=stepper_y FIELD=PID_VELOCITY_P FVAL={v.velocity_p}
    SET_TMC_FIELD STEPPER=stepper_y FIELD=PID_VELOCITY_I FVAL={v.velocity_i}
    G4 P200
    RESPOND TYPE=echo MSG="FOC: normal mode restored"

# ------------------------------------------------------------------------------
# TEST_RESONANCES_FOC AXIS=<X|Y>
# Wrapper around TEST_RESONANCES that uses FOC measurement mode.
# ------------------------------------------------------------------------------
[gcode_macro TEST_RESONANCES_FOC]
gcode:
    {% set axis = params.AXIS|default("X")|upper %}
    FOC_MEASUREMENT_MODE
    TEST_RESONANCES AXIS={axis}
    FOC_NORMAL_MODE

# ------------------------------------------------------------------------------
# SHAPER_CALIBRATE_FOC [AXIS=<X|Y>]
# Wrapper around SHAPER_CALIBRATE that uses FOC measurement mode.
# Omit AXIS to calibrate both axes sequentially.
# ------------------------------------------------------------------------------
[gcode_macro SHAPER_CALIBRATE_FOC]
gcode:
    {% set axis = params.AXIS|default("")|upper %}
    FOC_MEASUREMENT_MODE
    {% if axis == "X" %}
        SHAPER_CALIBRATE AXIS=X
    {% elif axis == "Y" %}
        SHAPER_CALIBRATE AXIS=Y
    {% else %}
        SHAPER_CALIBRATE
    {% endif %}
    FOC_NORMAL_MODE
