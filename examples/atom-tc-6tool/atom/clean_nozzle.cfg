#####################################################################
#  CLEAN_NOZZLE  ---  Raster-Wisch auf dem Bambu-Silikonwiper
#####################################################################
#
#  Prinzip vom Bambu A1 uebernommen: schnelle Huebe entlang der langen
#  Wiperachse (X), nach jedem Hub 0.5 mm Versatz in Y. Der A1 macht 12
#  X-Huebe ueber rund 2.5 mm Wiperbreite. Genau das bildet dieses Makro
#  ab. Kein Kreis-, Diagonal- oder Y-Durchstich-Muster: der Wiper ist
#  fuer das Raster konstruiert.
#
#  Maschinenwerte, gegen die das abgestimmt ist (Stand 02.09.2026):
#    max_accel 35000, square_corner_velocity 20, minimum_cruise_ratio 0.5
#    -> bei 33 mm Hub sind rund 760 mm/s Spitze moeglich, die 500 mm/s
#       des A1 werden also wirklich erreicht.
#    Faellt max_accel je zurueck auf 5000, sind es nur noch ~287 mm/s.
#    X position_max 355, Y position_max 361 (!), beacon
#    contact_max_hotend_temperature 185.
#
#  Wipergeometrie vermessen: X 38.6 bis 74.6, Y 353.5 bis 360.5,
#  Wischhoehe Z 2.6. Bei 360.5 steht die Duese satt in den Lamellen.
#
#  Aufruf:  CLEAN_NOZZLE            bei aktueller Temperatur
#           CLEAN_NOZZLE TEMP=150   heizt vorher auf und wartet
#
#####################################################################

[gcode_macro CLEAN_NOZZLE]
description: Raster-Wisch auf dem Silikonwiper (Bambu-A1-Prinzip)

# --- Geometrie ---
variable_x_min:        40.0    # 1.4 mm Reserve zur Wiperkante
variable_x_max:        73.0    # 1.6 mm Reserve zur Wiperkante
variable_y_start:     360.5    # tiefste Spur. position_max_y ist 361.0
variable_y_step:        0.5    # Spurversatz wie beim A1
variable_tracks:          6    # 6 Spuren = 2.5 mm, wie beim A1
variable_z_wipe:        2.6
variable_z_safe:       10.0
variable_corr_x_min:   35.0    # Freier Korridor im hinteren Streifen. Links
variable_corr_x_max:  100.0    # davon der Wiper, rechts erst die Nudge-Probe
                               # bei X129.62. Liegen Start- und Ziel-X beide
                               # darin, entfaellt der Umweg ueber approach_y.
variable_approach_y:  320.0    # Staging-Y fuer die X-Querfahrt. Der hintere
                               # Streifen ab ca. Y353 ist belegt (Wiper,
                               # Nudge-Probe bei X129.62/Y355.53, Bucket).
                               # Dort wird nie quer gefahren, nur gerade
                               # von vorne hinein. Gleicher Wert steckt in
                               # _PURGE_POS in der macros.cfg.
                               # SPERRZONE: rechts von X290 darf nichts
                               # weiter nach hinten als Y330. Dort sitzen
                               # A-Motor-Mount, Endstop und der Cooling
                               # Duct. Deshalb liegt der Staging-Punkt bei
                               # 320 und nicht hoeher.

# --- Dynamik ---
variable_wipe_speed:    500    # mm/s, identisch zum A1 (F30000)
variable_travel_speed:  300
variable_step_speed:     60
variable_passes:          1    # 1 Durchgang = 12 X-Huebe wie beim A1

gcode:
    {% set v      = printer["gcode_macro CLEAN_NOZZLE"] %}
    {% set temp   = params.TEMP|default(0)|float %}
    {% set f_wipe = v.wipe_speed   * 60 %}
    {% set f_trav = v.travel_speed * 60 %}
    {% set f_step = v.step_speed   * 60 %}
    {% set y_lim  = printer.toolhead.axis_maximum.y|float %}
    {% set t_max  = printer.configfile.settings.beacon.contact_max_hotend_temperature|float %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("CLEAN_NOZZLE: Achsen nicht gehomt.") }
    {% endif %}
    {% if v.y_start > y_lim %}
        { action_raise_error("CLEAN_NOZZLE: y_start %.2f liegt ueber position_max_y %.2f." % (v.y_start, y_lim)) }
    {% endif %}
    {% if temp > t_max %}
        { action_raise_error("CLEAN_NOZZLE: TEMP %.0f ueber contact_max_hotend_temperature %.0f. Contact-Homing wuerde danach fehlschlagen." % (temp, t_max)) }
    {% endif %}

    SAVE_GCODE_STATE NAME=clean_nozzle
    {% if temp > 0 %}
        M109 S{temp}
    {% endif %}
    M117 Duese reinigen
    G90

    # Anfahrt strikt achsweise, nie diagonal in den hinteren Streifen:
    # erst hoch, dann bei Bedarf nach vorne auf approach_y, dann X, dann
    # gerade in +Y hinein. Gleiches Prinzip wie NUDGE_MOVE_OVER_PROBE.
    {% set cx = printer.toolhead.position.x|float %}
    {% set cy = printer.toolhead.position.y|float %}
    {% set in_corr = cx >= v.corr_x_min and cx <= v.corr_x_max
                     and v.x_min >= v.corr_x_min and v.x_min <= v.corr_x_max %}

    G0 Z{v.z_safe} F3000
    {% if cy > v.approach_y and not in_corr %}
        G0 Y{v.approach_y} F{f_trav}
    {% endif %}
    G0 X{v.x_min} F{f_trav}
    G0 Y{v.y_start} F{f_trav}
    G0 Z{v.z_wipe} F1200

    {% for p in range(v.passes) %}
        {% for i in range(v.tracks) %}
            {% if p % 2 == 0 %}
                {% set y = v.y_start - (i * v.y_step) %}
            {% else %}
                {% set y = v.y_start - ((v.tracks - 1 - i) * v.y_step) %}
            {% endif %}
            G0 Y{y|round(3)} F{f_step}
            G0 X{v.x_max} F{f_wipe}
            G0 X{v.x_min} F{f_wipe}
        {% endfor %}
    {% endfor %}

    G0 Z{v.z_safe} F3000
    M400
    RESTORE_GCODE_STATE NAME=clean_nozzle MOVE=0
    M117
