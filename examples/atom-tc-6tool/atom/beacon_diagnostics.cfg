# ==============================================================================
# ATOM TC-6 — BEACON DIAGNOSTICS & ADVANCED FEATURES
# ==============================================================================
#
# Author: PrintStructor
# GitHub: https://github.com/PrintStructor
#
# Description:
#   Diagnostic and advanced calibration tools for Beacon contact probe
#   on the ATOM TC-6 toolchanger.
#
# Based on RatOS implementation:
# https://github.com/Rat-OS/RatOS-configuration
#
# ==============================================================================
# AVAILABLE DIAGNOSTIC TOOLS
# ==============================================================================
#
# ┌─────────────────────────────────────────────────────────────────┐
# │ BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET                             │
# ├─────────────────────────────────────────────────────────────────┤
# │ Calibrate nozzle thermal expansion (150°C → 250°C)             │
# │                                                                 │
# │ Usage: BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET INITIAL_TOOL=0      │
# │        [TEMP_LOW=150] [TEMP_HIGH=250]                          │
# │                                                                 │
# │ ⚠️  CRITICAL: Unload filament before running!                   │
# │ 🔧 Use smooth spring steel sheet (no texture)                  │
# │ 🌡️  Wait for thermal stability                                 │
# │                                                                 │
# │ Result: Expansion coefficient for temperature compensation     │
# └─────────────────────────────────────────────────────────────────┘
#
# ┌─────────────────────────────────────────────────────────────────┐
# │ BEACON_MEASURE_GANTRY_TWIST                                     │
# ├─────────────────────────────────────────────────────────────────┤
# │ Measure gantry twist across X-axis (left vs right deviation)   │
# │                                                                 │
# │ Usage: BEACON_MEASURE_GANTRY_TWIST [TEMP=150]                  │
# │                                                                 │
# │ Measures bed tilt to detect mechanical issues                  │
# └─────────────────────────────────────────────────────────────────┘
#
# ┌─────────────────────────────────────────────────────────────────┐
# │ BEACON_POKE_TEST                                                │
# ├─────────────────────────────────────────────────────────────────┤
# │ Test Beacon repeatability with multiple contact samples        │
# │                                                                 │
# │ Usage: BEACON_POKE_TEST [SAMPLES=20] [TEMP=150]                │
# │                                                                 │
# │ Reports: Range, StdDev, Min, Max for quality assessment        │
# └─────────────────────────────────────────────────────────────────┘
#
# ┌─────────────────────────────────────────────────────────────────┐
# │ BEACON_OFFSET_COMPARE_ACCURACY                                  │
# ├─────────────────────────────────────────────────────────────────┤
# │ Compare Beacon accuracy over multiple offset measurements      │
# │                                                                 │
# │ Usage: BEACON_OFFSET_COMPARE_ACCURACY [SAMPLES=10]             │
# │                                                                 │
# │ For validating offset calibration quality                      │
# └─────────────────────────────────────────────────────────────────┘
#
# Temperature Compensation (Runtime):
#
# Apply/Remove temperature offset compensation:
#   APPLY_NOZZLE_TEMP_OFFSET                - Enable compensation
#   CLEAR_NOZZLE_TEMP_OFFSET                - Disable compensation
#   SHOW_NOZZLE_TEMP_OFFSET                 - Show current status
#
# Note: Requires prior calibration with BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET
#
# ==============================================================================


# ==============================================================================
# SECTION 1: NOZZLE TEMPERATURE OFFSET CALIBRATION
# ==============================================================================

# IMPORTANT PREPARATION:
#   1. ⚠️ NO FILAMENT LOADED - Prevents oozing at 250°C!
#   2. 🔧 Use smooth spring steel sheet (textured surfaces affect measurements)
#   3. 🌡️ Wait for chamber/bed thermal stability
#   4. 🔍 Clean nozzle thoroughly

[gcode_macro BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET]
description: Calibrate nozzle thermal expansion for temperature compensation
# Usage: BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET INITIAL_TOOL=0 [TEMP_LOW=150] [TEMP_HIGH=250]
#
# CRITICAL: Unload filament BEFORE running! (prevents oozing at 250°C)
# Recommended: Smooth spring steel sheet for accurate measurements
variable_temp_low_z: 0.0
variable_temp_high_z: 0.0
variable_temp_low_value: 0
variable_temp_high_value: 0
variable_tool: 0
gcode:
    # Parameters
    {% set TEMP_LOW = params.TEMP_LOW|default(150)|int %}
    {% set TEMP_HIGH = params.TEMP_HIGH|default(250)|int %}
    {% set INITIAL_TOOL = params.INITIAL_TOOL|default(0)|int %}

    # Store values for helper macros
    SET_GCODE_VARIABLE MACRO=BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET VARIABLE=temp_low_value VALUE={TEMP_LOW}
    SET_GCODE_VARIABLE MACRO=BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET VARIABLE=temp_high_value VALUE={TEMP_HIGH}
    SET_GCODE_VARIABLE MACRO=BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET VARIABLE=tool VALUE={INITIAL_TOOL}

    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="Nozzle Temperature Offset Calibration"
    RESPOND MSG="Tool: T{INITIAL_TOOL} | Range: {TEMP_LOW}°C → {TEMP_HIGH}°C"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    # Temporarily raise contact max temp for calibration
    {% set original_max_temp = printer.configfile.settings.beacon.contact_max_hotend_temperature|default(185)|int %}
    RESPOND MSG="Raising contact_max_hotend_temperature: {original_max_temp}°C → 270°C"
    SET_BEACON_CONTACT_MAX_TEMP TEMP=270

    # Home if needed
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # Select initial tool
    T{INITIAL_TOOL}

    # Calculate bed center from stepper max positions
    {% set center_x = printer.configfile.settings.stepper_x.position_max / 2 %}
    {% set center_y = printer.configfile.settings.stepper_y.position_max / 2 %}

    # Move to bed center at safe Z
    G0 Z10 F3000
    G0 X{center_x} Y{center_y} F12000
    RESPOND MSG="Measuring at bed center ({center_x}, {center_y})"

    # Settle mechanics
    RESPOND MSG="Settling probe mechanics..."
    {% for i in range(3) %}
        BEACON_OFFSET_COMPARE
    {% endfor %}

    # === Measure at low temperature (3 samples) ===
    RESPOND MSG="Heating to {TEMP_LOW}°C..."
    M109 S{TEMP_LOW}
    G4 P10000  # 10s stabilization

    RESPOND MSG="Measuring at {TEMP_LOW}°C (3 samples)..."
    # Reset sample collector
    SET_GCODE_VARIABLE MACRO=_BEACON_SAMPLE_COLLECTOR VARIABLE=samples VALUE="[]"
    # Take 3 samples
    BEACON_OFFSET_COMPARE
    _BEACON_COLLECT_SAMPLE
    G4 P2000
    BEACON_OFFSET_COMPARE
    _BEACON_COLLECT_SAMPLE
    G4 P2000
    BEACON_OFFSET_COMPARE
    _BEACON_COLLECT_SAMPLE
    # Store average
    _BEACON_STORE_AVERAGE TYPE=low

    # === Measure at high temperature (3 samples) ===
    RESPOND MSG="Heating to {TEMP_HIGH}°C..."
    M109 S{TEMP_HIGH}
    G4 P20000  # 20s stabilization (high temp needs more time)

    RESPOND MSG="Measuring at {TEMP_HIGH}°C (3 samples)..."
    # Reset sample collector
    SET_GCODE_VARIABLE MACRO=_BEACON_SAMPLE_COLLECTOR VARIABLE=samples VALUE="[]"
    # Take 3 samples
    BEACON_OFFSET_COMPARE
    _BEACON_COLLECT_SAMPLE
    G4 P2000
    BEACON_OFFSET_COMPARE
    _BEACON_COLLECT_SAMPLE
    G4 P2000
    BEACON_OFFSET_COMPARE
    _BEACON_COLLECT_SAMPLE
    # Store average
    _BEACON_STORE_AVERAGE TYPE=high

    # === Calculate and store coefficient ===
    _BEACON_CALCULATE_EXPANSION_COEFFICIENT

    # Restore original contact max temp
    RESPOND MSG="Restoring contact_max_hotend_temperature to original"
    SET_BEACON_CONTACT_MAX_TEMP RESET=1

    # Cool down
    M104 S0
    RESPOND MSG="Calibration complete! Heater turned off."


[gcode_macro _BEACON_SAMPLE_COLLECTOR]
# Collects samples for averaging
variable_samples: []
gcode:
    # This macro just holds variables


[gcode_macro _BEACON_COLLECT_SAMPLE]
# Collects a single sample after BEACON_OFFSET_COMPARE
gcode:
    {% set last_z = printer.beacon.last_offset_result.position[2]|float %}
    {% set current_samples = printer["gcode_macro _BEACON_SAMPLE_COLLECTOR"].samples %}
    {% set new_samples = current_samples + [last_z] %}
    SET_GCODE_VARIABLE MACRO=_BEACON_SAMPLE_COLLECTOR VARIABLE=samples VALUE="{new_samples}"
    RESPOND MSG="  Sample {new_samples|length}: Z={last_z|round(6)} mm"


[gcode_macro _BEACON_STORE_AVERAGE]
# Calculates average and stores result
gcode:
    {% set TYPE = params.TYPE|lower %}
    {% set samples = printer["gcode_macro _BEACON_SAMPLE_COLLECTOR"].samples %}
    {% set temp_low = printer["gcode_macro BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET"].temp_low_value|int %}
    {% set temp_high = printer["gcode_macro BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET"].temp_high_value|int %}

    # Calculate average
    {% set sum = samples|sum %}
    {% set avg = sum / samples|length %}

    # Calculate range for quality assessment
    {% set range_val = (samples|max - samples|min) * 1000 %}

    # Quality assessment
    {% if range_val < 5 %}
        {% set quality = "✅ Excellent" %}
    {% elif range_val < 10 %}
        {% set quality = "✅ Good" %}
    {% elif range_val < 15 %}
        {% set quality = "⚠️ Acceptable" %}
    {% else %}
        {% set quality = "❌ Poor - consider repeating!" %}
    {% endif %}

    {% if TYPE == "low" %}
        SET_GCODE_VARIABLE MACRO=BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET VARIABLE=temp_low_z VALUE={avg}
        RESPOND MSG="  → Average @ {temp_low}°C: Z={avg|round(6)} mm (range: {range_val|round(1)}µm) {quality}"
    {% elif TYPE == "high" %}
        SET_GCODE_VARIABLE MACRO=BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET VARIABLE=temp_high_z VALUE={avg}
        RESPOND MSG="  → Average @ {temp_high}°C: Z={avg|round(6)} mm (range: {range_val|round(1)}µm) {quality}"
    {% endif %}


[gcode_macro _BEACON_CALCULATE_EXPANSION_COEFFICIENT]
gcode:
    {% set macro = printer["gcode_macro BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET"] %}
    {% set TOOL = macro.tool|int %}

    # Get stored values
    {% set temp_low_z = macro.temp_low_z|float %}
    {% set temp_high_z = macro.temp_high_z|float %}
    {% set temp_low_value = macro.temp_low_value|int %}
    {% set temp_high_value = macro.temp_high_value|int %}

    {% set temp_diff = temp_high_value - temp_low_value %}
    {% set z_diff = temp_high_z - temp_low_z %}
    {% set coefficient = z_diff / temp_diff %}
    {% set expansion_um = (z_diff * 1000)|round(1) %}

    # Store in saved variables
    SAVE_VARIABLE VARIABLE=nozzle_expansion_coefficient_t{TOOL} VALUE={coefficient}

    # Display results
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="Calibration Results (T{TOOL})"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="ΔZ: {expansion_um}µm over {temp_diff}°C"
    RESPOND MSG="Coefficient: {coefficient|round(8)} mm/°C"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="Saved: nozzle_expansion_coefficient_t{TOOL}"

    # Quality assessment
    {% if expansion_um|abs < 30 %}
        RESPOND MSG="⚠️ Low expansion - verify measurement"
    {% elif expansion_um|abs > 100 %}
        RESPOND MSG="⚠️ High expansion - verify measurement"
    {% else %}
        RESPOND MSG="✅ Normal expansion range"
    {% endif %}


[gcode_macro _BEACON_ECHO_EXPANSION_COEFFICIENT]
gcode:
    {% set TOOL = params.TOOL|int %}
    {% set svv = printer.save_variables.variables %}
    {% set coeff = svv["nozzle_expansion_coefficient_t" ~ TOOL]|default(0)|float %}

    RESPOND MSG="T{TOOL} thermal expansion: {coeff} mm/°C"


# ==============================================================================
# SECTION 2: BEACON GANTRY TWIST MEASUREMENT
# ==============================================================================

[gcode_macro BEACON_MEASURE_GANTRY_TWIST]
description: Measure gantry deflection at 9 points
variable_reference_z: 0.0
variable_front_left: 0.0
variable_front: 0.0
variable_front_right: 0.0
variable_left: 0.0
variable_right: 0.0
variable_back_left: 0.0
variable_back: 0.0
variable_back_right: 0.0
variable_needs_compensation: False
gcode:
    {% set INITIAL_TOOL = params.INITIAL_TOOL|default(0)|int %}

    # Bed dimensions from config
    {% set bed_mesh = printer.configfile.settings.bed_mesh %}
    {% set min_x = bed_mesh.mesh_min[0]|float %}
    {% set max_x = bed_mesh.mesh_max[0]|float %}
    {% set min_y = bed_mesh.mesh_min[1]|float %}
    {% set max_y = bed_mesh.mesh_max[1]|float %}
    {% set center_x = (min_x + max_x) / 2 %}
    {% set center_y = (min_y + max_y) / 2 %}
    {% set margin = params.MARGIN|default(50)|float %}  # Stay away from bed edges (configurable, default 50mm)

    # Calculate probe points
    {% set points = [
        [min_x + margin, min_y + margin, "front_left"],
        [center_x, min_y + margin, "front"],
        [max_x - margin, min_y + margin, "front_right"],
        [min_x + margin, center_y, "left"],
        [center_x, center_y, "center"],
        [max_x - margin, center_y, "right"],
        [min_x + margin, max_y - margin, "back_left"],
        [center_x, max_y - margin, "back"],
        [max_x - margin, max_y - margin, "back_right"]
    ] %}

    RESPOND MSG="Starting gantry twist measurement..."

    # Home if needed
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # Select tool
    T{INITIAL_TOOL}

    # Probe all 9 points
    {% for point in points %}
        {% set x = point[0] %}
        {% set y = point[1] %}
        {% set location = point[2] %}

        RESPOND MSG="Probing {location}..."
        G0 X{x} Y{y} F12000
        BEACON_OFFSET_COMPARE
        _BEACON_STORE_GANTRY_TWIST LOCATION={location}
    {% endfor %}

    # Display results
    _BEACON_ECHO_GANTRY_TWIST

    RESPOND MSG="Gantry twist measurement complete!"


[gcode_macro _BEACON_STORE_GANTRY_TWIST]
gcode:
    {% set location = params.LOCATION|lower %}
    {% set last_z = printer.beacon.last_offset_result.delta|float %}

    {% if location == "center" %}
        SET_GCODE_VARIABLE MACRO=BEACON_MEASURE_GANTRY_TWIST VARIABLE=reference_z VALUE={last_z}
    {% else %}
        {% set reference_z = printer["gcode_macro BEACON_MEASURE_GANTRY_TWIST"].reference_z|default(0)|float %}
        SET_GCODE_VARIABLE MACRO=BEACON_MEASURE_GANTRY_TWIST VARIABLE={location} VALUE={(last_z - reference_z)}
    {% endif %}


[gcode_macro _BEACON_ECHO_GANTRY_TWIST]
gcode:
    # Get results (convert to micrometers)
    {% set reference_z = printer["gcode_macro BEACON_MEASURE_GANTRY_TWIST"].reference_z|default(0)|float * 1000 %}
    {% set front_left = printer["gcode_macro BEACON_MEASURE_GANTRY_TWIST"].front_left|default(0)|float * 1000 %}
    {% set front = printer["gcode_macro BEACON_MEASURE_GANTRY_TWIST"].front|default(0)|float * 1000 %}
    {% set front_right = printer["gcode_macro BEACON_MEASURE_GANTRY_TWIST"].front_right|default(0)|float * 1000 %}
    {% set right = printer["gcode_macro BEACON_MEASURE_GANTRY_TWIST"].right|default(0)|float * 1000 %}
    {% set back_right = printer["gcode_macro BEACON_MEASURE_GANTRY_TWIST"].back_right|default(0)|float * 1000 %}
    {% set back = printer["gcode_macro BEACON_MEASURE_GANTRY_TWIST"].back|default(0)|float * 1000 %}
    {% set back_left = printer["gcode_macro BEACON_MEASURE_GANTRY_TWIST"].back_left|default(0)|float * 1000 %}
    {% set left = printer["gcode_macro BEACON_MEASURE_GANTRY_TWIST"].left|default(0)|float * 1000 %}

    # Calculate max deviation
    {% set max_value = [(front_left|abs), (front|abs), (front_right|abs), (left|abs), (right|abs), (back_left|abs), (back|abs), (back_right|abs)]|max %}

    # Display results
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="Gantry Twist Measurement Results"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="Front left:    {front_left|round(1)}μm"
    RESPOND MSG="Front center:  {front|round(1)}μm"
    RESPOND MSG="Front right:   {front_right|round(1)}μm"
    RESPOND MSG="Left center:   {left|round(1)}μm"
    RESPOND MSG="Right center:  {right|round(1)}μm"
    RESPOND MSG="Back left:     {back_left|round(1)}μm"
    RESPOND MSG="Back center:   {back|round(1)}μm"
    RESPOND MSG="Back right:    {back_right|round(1)}μm"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    # Recommendations
    {% if max_value <= 50 %}
        RESPOND MSG="✅ Very low gantry twist: {max_value|round(1)}μm"
        RESPOND MSG="No scan compensation needed!"
    {% elif max_value <= 100 %}
        RESPOND MSG="⚠️  Low gantry twist: {max_value|round(1)}μm"
        RESPOND MSG="Consider beacon scan compensation"
        SET_GCODE_VARIABLE MACRO=BEACON_MEASURE_GANTRY_TWIST VARIABLE=needs_compensation VALUE=True
    {% elif max_value <= 150 %}
        RESPOND MSG="⚠️  High gantry twist: {max_value|round(1)}μm"
        RESPOND MSG="Beacon scan compensation recommended!"
        SET_GCODE_VARIABLE MACRO=BEACON_MEASURE_GANTRY_TWIST VARIABLE=needs_compensation VALUE=True
    {% else %}
        RESPOND MSG="❌ VERY HIGH gantry twist: {max_value|round(1)}μm"
        RESPOND MSG="Investigate mechanical issues!"
        RESPOND MSG="Check belt tension, frame squareness"
        SET_GCODE_VARIABLE MACRO=BEACON_MEASURE_GANTRY_TWIST VARIABLE=needs_compensation VALUE=True
    {% endif %}


# ==============================================================================
# SECTION 3: BEACON POKE TEST (Contact Mechanism Validation)
# ==============================================================================

[gcode_macro BEACON_POKE_TEST]
description: Test Beacon contact mechanism with multiple samples (validates latency and reliability)
variable_poke_samples: []
gcode:
    {% set SAMPLES = params.SAMPLES|default(5)|int %}
    {% set TOP = params.TOP|default(5)|float %}
    {% set BOTTOM = params.BOTTOM|default(-0.3)|float %}
    {% set SPEED = params.SPEED|default(3)|float %}

    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="Beacon Poke Test ({SAMPLES} samples)"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    # Clear previous results
    SET_GCODE_VARIABLE MACRO=BEACON_POKE_TEST VARIABLE=poke_samples VALUE="[]"

    # Home if needed
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # Move to bed center
    {% set center_x = printer.configfile.settings.bed_mesh.zero_reference_position[0]|float %}
    {% set center_y = printer.configfile.settings.bed_mesh.zero_reference_position[1]|float %}
    G0 X{center_x} Y{center_y} F12000

    # Run poke tests
    {% for i in range(SAMPLES) %}
        RESPOND MSG="→ Sample {i+1}/{SAMPLES}..."
        BEACON_POKE TOP={TOP} BOTTOM={BOTTOM} SPEED={SPEED}
        _BEACON_STORE_POKE_RESULT SAMPLE={i+1}
        G4 P500  # 500ms delay between samples
    {% endfor %}

    # Display results
    _BEACON_ECHO_POKE_RESULTS


[gcode_macro _BEACON_STORE_POKE_RESULT]
gcode:
    {% set sample_num = params.SAMPLE|int %}
    {% set last_result = printer.beacon.last_poke_result %}

    {% if last_result %}
        {% set latency = last_result.latency %}
        {% set samples = printer["gcode_macro BEACON_POKE_TEST"].poke_samples %}
        {% set new_samples = samples + [latency] %}
        SET_GCODE_VARIABLE MACRO=BEACON_POKE_TEST VARIABLE=poke_samples VALUE="{new_samples}"
    {% endif %}


[gcode_macro _BEACON_ECHO_POKE_RESULTS]
gcode:
    {% set samples = printer["gcode_macro BEACON_POKE_TEST"].poke_samples %}
    {% set sample_count = samples|length %}

    {% if sample_count == 0 %}
        RESPOND TYPE=error MSG="❌ No poke samples collected!"
        {action_raise_error("Poke test failed")}
    {% endif %}

    # Calculate statistics
    {% set total = namespace(sum=0, min=999999, max=0) %}
    {% for latency in samples %}
        {% set total.sum = total.sum + latency %}
        {% set total.min = [total.min, latency]|min %}
        {% set total.max = [total.max, latency]|max %}
    {% endfor %}
    {% set avg_latency = (total.sum / sample_count)|round(0) %}
    {% set min_latency = total.min %}
    {% set max_latency = total.max %}

    # Display results
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="Beacon Poke Test Results"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="Samples:     {sample_count}"
    RESPOND MSG="Average:     {avg_latency|round(0)} µs"
    RESPOND MSG="Min:         {min_latency} µs"
    RESPOND MSG="Max:         {max_latency} µs"
    RESPOND MSG="Range:       {(max_latency - min_latency)} µs"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    # Interpretation (convert to milliseconds for display)
    {% set avg_ms = (avg_latency / 1000.0)|round(2) %}
    {% if avg_latency < 4000 %}
        RESPOND MSG="✅ Excellent performance: {avg_ms}ms"
        RESPOND MSG="   Contact mechanism is working perfectly!"
    {% elif avg_latency < 6000 %}
        RESPOND MSG="⚠️  Acceptable performance: {avg_ms}ms"
        RESPOND MSG="   Contact mechanism is working, but could be better"
        RESPOND MSG="   Consider checking mechanical connections"
    {% else %}
        RESPOND MSG="❌ Poor performance: {avg_ms}ms"
        RESPOND MSG="   Latency is too high!"
        RESPOND MSG="   Check:"
        RESPOND MSG="     - Beacon contact sensor connection"
        RESPOND MSG="     - Mechanical interference"
        RESPOND MSG="     - USB cable quality"
    {% endif %}

    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


# ==============================================================================
# SECTION 4: NOZZLE TEMPERATURE OFFSET APPLICATION
# ==============================================================================
# Apply calibrated thermal expansion compensation during printing
# Must run BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET for each tool first!

[gcode_macro _NOZZLE_TEMP_OFFSET_VARS]
description: Storage for currently applied thermal offset
variable_current_offset: 0.0          # Currently applied Z adjustment (mm)
variable_reference_temp: 150          # Reference temperature for calibration (°C)
variable_last_tool: -1                # Last tool this was applied to
gcode:
    # This macro just stores variables, no action needed

[gcode_macro APPLY_NOZZLE_TEMP_OFFSET]
description: Apply thermal expansion compensation based on current nozzle temperature
# Usage: APPLY_NOZZLE_TEMP_OFFSET [TOOL=<0-5>]
# Call this in PRINT_START after heating, and optionally after tool changes
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set vars = printer["gcode_macro _NOZZLE_TEMP_OFFSET_VARS"] %}
    {% set reference_temp = vars.reference_temp|float %}
    {% set current_applied = vars.current_offset|float %}

    # Determine which tool to use
    {% if params.TOOL is defined %}
        {% set tool_num = params.TOOL|int %}
    {% else %}
        # Auto-detect current tool
        {% set tool_num = printer.toolchanger.tool_number|default(0)|int %}
    {% endif %}

    # Get extruder for this tool
    {% if tool_num == 0 %}
        {% set extruder_name = "extruder" %}
    {% else %}
        {% set extruder_name = "extruder" ~ tool_num %}
    {% endif %}

    # Get current nozzle temperature
    {% set current_temp = printer[extruder_name].temperature|float %}

    # Get coefficient for this tool
    {% set coeff_var = "nozzle_expansion_coefficient_t" ~ tool_num %}
    {% set coefficient = svv[coeff_var]|default(0)|float %}

    # Check if tool has calibration data
    {% if coefficient == 0 %}
        RESPOND MSG="⚠️ T{tool_num} has no thermal expansion calibration!"
        RESPOND MSG="   Run: BEACON_CALIBRATE_NOZZLE_TEMP_OFFSET INITIAL_TOOL={tool_num}"
        # Don't apply anything, just clear any existing offset
        {% if current_applied != 0 %}
            SET_GCODE_OFFSET Z_ADJUST={-current_applied} MOVE=0
            SET_GCODE_VARIABLE MACRO=_NOZZLE_TEMP_OFFSET_VARS VARIABLE=current_offset VALUE=0.0
            RESPOND MSG="   Cleared previous thermal offset: {current_applied|round(4)}mm"
        {% endif %}
    {% else %}
        # Calculate new thermal offset
        {% set temp_diff = current_temp - reference_temp %}
        {% set new_offset = temp_diff * coefficient %}

        # Calculate adjustment needed (remove old, add new)
        {% set adjustment = new_offset - current_applied %}

        # Apply the adjustment
        {% if adjustment|abs > 0.0001 %}  # Only adjust if meaningful change
            SET_GCODE_OFFSET Z_ADJUST={adjustment} MOVE=0
            SET_GCODE_VARIABLE MACRO=_NOZZLE_TEMP_OFFSET_VARS VARIABLE=current_offset VALUE={new_offset}
            SET_GCODE_VARIABLE MACRO=_NOZZLE_TEMP_OFFSET_VARS VARIABLE=last_tool VALUE={tool_num}

            RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            RESPOND MSG="Thermal Offset Applied (T{tool_num})"
            RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            RESPOND MSG="Nozzle temp:    {current_temp|round(1)}°C"
            RESPOND MSG="Reference:      {reference_temp}°C"
            RESPOND MSG="ΔT:             {temp_diff|round(1)}°C"
            RESPOND MSG="Coefficient:    {coefficient|round(8)} mm/°C"
            RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            RESPOND MSG="Z offset:       +{new_offset|round(4)}mm ({(new_offset*1000)|round(1)}µm)"
            {% if current_applied != 0 %}
                RESPOND MSG="Previous:       +{current_applied|round(4)}mm"
                RESPOND MSG="Adjustment:     {'+' if adjustment > 0 else ''}{adjustment|round(4)}mm"
            {% endif %}
            RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        {% else %}
            RESPOND MSG="Thermal offset unchanged: +{new_offset|round(4)}mm (T{tool_num} @ {current_temp|round(1)}°C)"
        {% endif %}
    {% endif %}


[gcode_macro CLEAR_NOZZLE_TEMP_OFFSET]
description: Remove any applied thermal expansion compensation
gcode:
    {% set vars = printer["gcode_macro _NOZZLE_TEMP_OFFSET_VARS"] %}
    {% set current_applied = vars.current_offset|float %}

    {% if current_applied != 0 %}
        # Remove the current offset
        SET_GCODE_OFFSET Z_ADJUST={-current_applied} MOVE=0
        SET_GCODE_VARIABLE MACRO=_NOZZLE_TEMP_OFFSET_VARS VARIABLE=current_offset VALUE=0.0
        SET_GCODE_VARIABLE MACRO=_NOZZLE_TEMP_OFFSET_VARS VARIABLE=last_tool VALUE=-1

        RESPOND MSG="Thermal offset cleared: -{current_applied|round(4)}mm"
    {% else %}
        RESPOND MSG="No thermal offset was applied"
    {% endif %}


[gcode_macro SHOW_NOZZLE_TEMP_OFFSET]
description: Display current thermal offset status for all tools
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set vars = printer["gcode_macro _NOZZLE_TEMP_OFFSET_VARS"] %}
    {% set current_applied = vars.current_offset|float %}
    {% set reference_temp = vars.reference_temp|float %}
    {% set last_tool = vars.last_tool|int %}

    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="Nozzle Thermal Expansion Status"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="Reference temp: {reference_temp}°C"
    RESPOND MSG="Current offset: {current_applied|round(4)}mm"
    {% if last_tool >= 0 %}
        RESPOND MSG="Applied to:     T{last_tool}"
    {% endif %}
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="Calibrated coefficients:"

    {% for i in range(6) %}
        {% set coeff_var = "nozzle_expansion_coefficient_t" ~ i %}
        {% set coefficient = svv[coeff_var]|default(0)|float %}
        {% if coefficient != 0 %}
            # Calculate example offset at 260°C
            {% set example_offset = (260 - reference_temp) * coefficient %}
            RESPOND MSG="  T{i}: {coefficient|round(8)} mm/°C → +{example_offset|round(3)}mm @ 260°C"
        {% else %}
            RESPOND MSG="  T{i}: Not calibrated"
        {% endif %}
    {% endfor %}
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


# ==============================================================================
# SECTION 5: BEACON ACCURACY TEST
# ==============================================================================

[gcode_macro BEACON_OFFSET_COMPARE_ACCURACY]
description: Test Beacon repeatability (10 samples)
gcode:
    {% set INITIAL_TOOL = params.INITIAL_TOOL|default(0)|int %}
    {% set SAMPLES = params.SAMPLES|default(10)|int %}

    RESPOND MSG="Starting Beacon accuracy test ({SAMPLES} samples)..."

    # Home if needed
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # Select tool
    T{INITIAL_TOOL}

    # Collect samples
    {% for i in range(SAMPLES) %}
        BEACON_OFFSET_COMPARE
        {% if i < SAMPLES - 1 %}
            G4 P500  # 500ms delay between samples
        {% endif %}
    {% endfor %}

    RESPOND MSG="Beacon accuracy test complete!"
    RESPOND MSG="Check console for detailed statistics"
