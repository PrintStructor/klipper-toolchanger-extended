#####################################################################
#  NUDGE RING XY CALIBRATION
#
#  Measures only neighbouring tools in a closed ring, every pair in
#  both directions:
#      T0<>T1  T1<>T2  T2<>T3  T3<>T4  T4<>T5  T5<>T0
#  That is 12 instead of 30 measurements.
#
#  Both directions are required. Every single measurement carries a
#  constant bias of roughly +0.007 mm in X and +0.008 mm in Y, which
#  only cancels when a pair is measured both ways.
#
#  At the end _NUDGE_RING_ADJUST computes one consistent position per
#  tool (least squares solution for a single closed loop) and writes
#  all 30 nudge_xy_i_j values, so any tool can act as INITIAL_TOOL.
#  This is required anyway: TOOL_LOCATE_SENSOR zeroes every offset of
#  the reference tool, the ring only re-measures two of them.
#
#  The 12 raw measurements are kept as nudge_raw_i_j and the ring
#  closure as nudge_ring_closure in variables.cfg.
#
#  Usage:  NUDGE_CALIBRATE_RING_XY [MAX_CLOSURE=0.05]
#
#  If the ring closure exceeds MAX_CLOSURE nothing is saved. Run
#  FIRMWARE_RESTART in that case, check the probe and repeat.
#####################################################################

[gcode_macro NUDGE_CALIBRATE_RING_XY]
description: NUDGE XY calibration over a ring of neighbours, both directions (12 measurements), least squares adjusted
gcode:
    {% set PROBE_TEMP = 140 %}
    {% set TEMP_TOLERANCE = 5 %}
    {% set BED_CENTER_X = 177.5 %}
    {% set BED_CENTER_Y = 177.5 %}
    {% set MAX_CLOSURE = params.MAX_CLOSURE|default(0.05)|float %}
    {% set N = printer.toolchanger.params_max_tool_count|default(6)|int %}
    {% set ORDER = range(N)|join(",") %}

    {% if N < 3 %}
        { action_raise_error("Ring calibration needs at least 3 tools, found %d" % N) }
    {% endif %}

    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="  NUDGE RING XY CALIBRATION"
    RESPOND MSG="  {N} tools, {2 * N} measurements"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    SET_GCODE_VARIABLE MACRO=globals VARIABLE=global_z_offset VALUE=0.00

    CHECK_HOMING
    G90
    G0 Z10 F1000

    # Cooling on: keeps filament residue from sticking to the probe pin
    SET_FAN_SPEED FAN=fan0 SPEED=0.25
    SET_FAN_SPEED FAN=BedFans SPEED=1.0

    {% set done = namespace(count=0) %}
    {% for initial in range(N) %}
        {% set nxt = (initial + 1) % N %}
        {% set prv = (initial - 1 + N) % N %}

        RESPOND MSG=""
        RESPOND MSG="━━━ Reference T{initial} ({initial + 1}/{N}) ━━━"

        G0 Z10 F1000
        G0 X{BED_CENTER_X} Y{BED_CENTER_Y} F6000
        T{initial}
        M109 S{PROBE_TEMP} T{initial}

        NUDGE_MOVE_OVER_PROBE
        TOOL_LOCATE_SENSOR
        SET_GCODE_OFFSET X=0 Y=0

        {% for measure in [nxt, prv] %}
            {% set done.count = done.count + 1 %}
            RESPOND MSG="  T{initial}→T{measure} ({done.count}/{2 * N})"
            G0 Z10 F1000
            G0 X{BED_CENTER_X} Y{BED_CENTER_Y} F6000
            T{measure}
            # M109 blocks and the sensor follows the tool being measured
            {% if measure == 0 %}
                M109 S{PROBE_TEMP}
                TEMPERATURE_WAIT SENSOR=extruder MINIMUM={PROBE_TEMP - TEMP_TOLERANCE} MAXIMUM={PROBE_TEMP + TEMP_TOLERANCE}
            {% else %}
                M109 S{PROBE_TEMP} T{measure}
                TEMPERATURE_WAIT SENSOR=extruder{measure} MINIMUM={PROBE_TEMP - TEMP_TOLERANCE} MAXIMUM={PROBE_TEMP + TEMP_TOLERANCE}
            {% endif %}
            NUDGE_MOVE_OVER_PROBE
            TOOL_CALIBRATE_TOOL_OFFSET
            G4 P500
        {% endfor %}
    {% endfor %}

    # Park and cool down before the adjustment, so an abort there
    # never leaves heaters running
    G0 Z10 F1000
    G0 X{BED_CENTER_X} Y{BED_CENTER_Y} F6000
    TURN_OFF_HEATERS
    SET_FAN_SPEED FAN=fan0 SPEED=0
    BEDFANSOFF

    # Must be its own macro: it has to read variables.cfg after all
    # measurements were written, not when this macro was expanded
    _NUDGE_RING_ADJUST ORDER={ORDER} MAX_CLOSURE={MAX_CLOSURE}

    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    RESPOND MSG="  RING CALIBRATION COMPLETE, saving config"
    RESPOND MSG="━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    SAVE_CONFIG


[gcode_macro _NUDGE_RING_ADJUST]
description: Least squares adjustment for NUDGE_CALIBRATE_RING_XY (called automatically)
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set MAX_CLOSURE = params.MAX_CLOSURE|default(0.05)|float %}
    {% set ns = namespace(order=[], dx=[], dy=[], px=[], py=[], missing="") %}
    {% for s in params.ORDER.split(",") %}
        {% set ns.order = ns.order + [s|int] %}
    {% endfor %}
    {% set n = ns.order|length %}

    # 1) All 2n raw measurements must be present
    {% for k in range(n) %}
        {% set a = ns.order[k] %}
        {% set b = ns.order[(k + 1) % n] %}
        {% for key in ["nudge_xy_%d_%d" % (a, b), "nudge_xy_%d_%d" % (b, a)] %}
            {% if key not in svv %}
                {% set ns.missing = ns.missing ~ " " ~ key %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    {% if ns.missing %}
        { action_raise_error("Ring adjust: missing measurements:%s. Nothing saved." % ns.missing) }
    {% endif %}

    # 2) Average every edge over both directions. The constant per
    #    measurement bias cancels here.
    {% for k in range(n) %}
        {% set a = ns.order[k] %}
        {% set b = ns.order[(k + 1) % n] %}
        {% set f = svv["nudge_xy_%d_%d" % (a, b)] %}
        {% set r = svv["nudge_xy_%d_%d" % (b, a)] %}
        {% set ns.dx = ns.dx + [((f[0]|float) - (r[0]|float)) / 2] %}
        {% set ns.dy = ns.dy + [((f[1]|float) - (r[1]|float)) / 2] %}
    {% endfor %}

    # 3) Ring closure: walking once around the ring must end at zero
    {% set cx = ns.dx|sum %}
    {% set cy = ns.dy|sum %}
    {% set closure = (cx * cx + cy * cy) ** 0.5 %}

    RESPOND MSG=""
    RESPOND MSG="  Ring closure: X {'%+.4f' % cx}  Y {'%+.4f' % cy}  ({'%.4f' % closure} mm, limit {'%.3f' % MAX_CLOSURE})"
    {% if closure > MAX_CLOSURE %}
        { action_raise_error("Ring closure %.4f mm exceeds MAX_CLOSURE %.3f mm. Nothing saved. Run FIRMWARE_RESTART, check the probe and repeat." % (closure, MAX_CLOSURE)) }
    {% endif %}

    # 4) Spread the closure evenly over all edges (least squares for a
    #    single loop with equal weights), then accumulate positions
    {% set ns.px = [0.0] %}
    {% set ns.py = [0.0] %}
    {% for k in range(n - 1) %}
        {% set ns.px = ns.px + [ns.px[k] + ns.dx[k] - cx / n] %}
        {% set ns.py = ns.py + [ns.py[k] + ns.dy[k] - cy / n] %}
    {% endfor %}

    # 5) Keep the raw measurements for later analysis
    {% for k in range(n) %}
        {% set a = ns.order[k] %}
        {% set b = ns.order[(k + 1) % n] %}
        {% set f = svv["nudge_xy_%d_%d" % (a, b)] %}
        {% set r = svv["nudge_xy_%d_%d" % (b, a)] %}
        SAVE_VARIABLE VARIABLE=nudge_raw_{a}_{b} VALUE=({'%.4f' % (f[0]|float)},{'%.4f' % (f[1]|float)})
        SAVE_VARIABLE VARIABLE=nudge_raw_{b}_{a} VALUE=({'%.4f' % (r[0]|float)},{'%.4f' % (r[1]|float)})
    {% endfor %}
    SAVE_VARIABLE VARIABLE=nudge_ring_closure VALUE=({'%.4f' % cx},{'%.4f' % cy})

    RESPOND MSG="  Adjusted positions relative to T{ns.order[0]}:"
    {% for k in range(n) %}
        RESPOND MSG="    T{ns.order[k]}  X {'%+.4f' % ns.px[k]}  Y {'%+.4f' % ns.py[k]}"
    {% endfor %}

    # 6) Write every pair, both into variables.cfg and staged for SAVE_CONFIG
    {% for a in range(n) %}
        {% for b in range(n) %}
            {% if a != b %}
                {% set i = ns.order[a] %}
                {% set j = ns.order[b] %}
                {% set x = ns.px[b] - ns.px[a] %}
                {% set y = ns.py[b] - ns.py[a] %}
                SAVE_VARIABLE VARIABLE=nudge_xy_{i}_{j} VALUE=({'%.4f' % x},{'%.4f' % y})
                TC_SAVE_CONFIG_VALUE SECTION="tool T{i}" OPTION="t{j}_xy_offset" VALUE="{'%.4f' % x}, {'%.4f' % y}"
            {% endif %}
        {% endfor %}
    {% endfor %}
    RESPOND MSG="  {n * (n - 1)} offsets written"
