# ==============================================================================
# DOOM - startet das Spiel auf dem HelixScreen
# ==============================================================================
# Der Umweg ueber ein Makro ist noetig, weil Eingaben eingehaengte
# Plugin-Widgets nicht erreichen. M118 gibt eine Zeile in die Konsole aus,
# Moonraker reicht sie als notify_gcode_response weiter, und das Plugin
# erkennt sie.
[gcode_macro DOOM]
description: DOOM auf dem Display starten
gcode:
    M118 HELIX_DOOM_START

[gcode_macro DOOM_STOP]
description: DOOM beenden
gcode:
    M118 HELIX_DOOM_STOP

# ==============================================================================
# Spiele auf dem Display
# ==============================================================================
# HelixScreen belegt DRM exklusiv - ein Spiel kann nur laufen, wenn der Dienst
# weicht. Die Startskripte erledigen das und holen ihn danach zurueck, auch
# bei einem Abbruch.
#
# Voraussetzung ist eine eng gefasste sudoers-Regel, die dem Benutzer pi
# ausschliesslich das Stoppen und Starten dieses einen Dienstes erlaubt.
#
# timeout: 0 bedeutet, dass Klipper nicht auf das Ende wartet - ein Spiel
# laeuft schliesslich, bis man es beendet.

[gcode_shell_command doom_play]
command: /home/pi/bin/doom-play
timeout: 86400.0
verbose: False

[gcode_shell_command doom3_play]
command: /home/pi/bin/doom3-play
timeout: 86400.0
verbose: False

[gcode_shell_command games_stop]
command: /usr/bin/pkill -f "doom-fb|dhewm3|sm64"
timeout: 10
verbose: False

[gcode_macro DOOM_PLAY]
description: DOOM 1 auf dem Display starten
gcode:
    M118 Starte DOOM ...
    RUN_SHELL_COMMAND CMD=doom_play

[gcode_macro DOOM3_PLAY]
description: DOOM 3 auf dem Display starten
gcode:
    M118 Starte DOOM 3 ...
    RUN_SHELL_COMMAND CMD=doom3_play

[gcode_macro GAME_STOP]
description: Laufendes Spiel beenden, HelixScreen kommt zurueck
gcode:
    RUN_SHELL_COMMAND CMD=games_stop

[gcode_shell_command mario_play]
command: /home/pi/bin/mario-play
timeout: 86400.0
verbose: False

[gcode_macro MARIO_PLAY]
description: Super Mario 64 auf dem Display starten
gcode:
    M118 Starte Super Mario 64 ...
    RUN_SHELL_COMMAND CMD=mario_play



# ==============================================================================
# UNLOAD_FILAMENT / UNLOAD_ALL
# ==============================================================================
# Zweistufiger Auszug:
#
#   Stufe 1 - langsam (5 mm/s) ueber die ersten Millimeter. Hier reisst die
#             Spitze aus der Schmelzzone ab. Zu schnell und der Faden reisst
#             unsauber oder haengt fest.
#   Stufe 2 - zuegig (40 mm/s) fuer den Rest des Wegs. Das Filament ist dann
#             bereits aus dem heissen Bereich heraus; langsam zu fahren
#             wuerde es dort nur weiter aufweichen lassen.
#
# Davor ein kurzes Vorschieben: das driegt die Spitze zusammen und verhindert
# den typischen langen Faden. Bei ABS lohnt sich das mehr als bei PLA.
#
# Die Gesamtstrecke von 85 mm ist der Abstand Antriebsrad -> Duese im
# ATOM-Toolhead. Ueber PURGE_LEN und UNLOAD_LEN anpassbar.
# ==============================================================================

# ------------------------------------------------------------------------------
# _PURGE_POS / _GOTO_PURGE_POS
# ------------------------------------------------------------------------------
# Gemeinsame Purge-Position fuer Load und Unload. Sie liegt direkt rechts
# neben dem Silikonwiper (der endet bei X 74.6) und auf derselben Y-Spur,
# so dass ein anschliessendes CLEAN_NOZZLE nur noch in X und Z fahren muss.
[gcode_macro _PURGE_POS]
description: Position ueber dem Purge Bucket
variable_x: 84.6
variable_y: 360.5
variable_z: 5.5
variable_speed: 300             # mm/s Anfahrt
variable_corr_x_min: 35.0       # Freier Korridor im hinteren Streifen. Links
variable_corr_x_max: 100.0      # davon der Wiper, rechts erst die Nudge-Probe
                                # bei X129.62. Liegen Start- und Ziel-X beide
                                # darin, entfaellt der Umweg ueber approach_y.
variable_approach_y: 320.0      # Staging-Y fuer die X-Querfahrt. Der hintere
                                # Streifen ab ca. Y353 ist belegt (Wiper,
                                # Nudge-Probe bei X129.62/Y355.53, Bucket).
                                # Gleicher Wert steckt in CLEAN_NOZZLE in
                                # atom/clean_nozzle.cfg.
                                # SPERRZONE: rechts von X290 darf nichts
                                # weiter nach hinten als Y330. Dort sitzen
                                # A-Motor-Mount, Endstop und der Cooling
                                # Duct. Deshalb liegt der Staging-Punkt bei
                                # 320 und nicht hoeher.
gcode:

[gcode_macro _GOTO_PURGE_POS]
description: Faehrt ueber den Purge Bucket, sofern gehomt
gcode:
    {% set p = printer["gcode_macro _PURGE_POS"] %}
    {% if "xyz" in printer.toolhead.homed_axes %}
        G90
        # Strikt achsweise, nie diagonal in den hinteren Streifen hinein:
        # hoch, bei Bedarf nach vorne auf approach_y, dann X, dann gerade
        # in +Y. Sonst schneidet die Querfahrt die Nudge-Probe.
        {% set cx = printer.toolhead.position.x|float %}
        {% set cy = printer.toolhead.position.y|float %}
        {% set in_corr = cx >= p.corr_x_min and cx <= p.corr_x_max
                         and p.x >= p.corr_x_min and p.x <= p.corr_x_max %}

        G0 Z{[p.z, printer.toolhead.position.z]|max} F3000
        {% if cy > p.approach_y and not in_corr %}
            G0 Y{p.approach_y} F{p.speed * 60}
        {% endif %}
        G0 X{p.x} F{p.speed * 60}
        G0 Y{p.y} F{p.speed * 60}
        G0 Z{p.z} F3000
    {% endif %}

# ------------------------------------------------------------------------------
# PURGE_NOZZLE [LEN=<mm>] [TEMP=<c>] [FAN=<0..1>] [WIPE=<0|1>] [KEEPHOT=<0|1>]
# ------------------------------------------------------------------------------
# Eigenstaendiges Purgen ueber dem Bucket, gedacht als Button. Die Defaults
# kommen aus _LOAD_SETTINGS, das Verhalten entspricht dem Purge-Teil von
# LOAD_FILAMENT. LOAD_FILAMENT selbst bleibt davon unberuehrt und bringt
# seine eigene Kopie mit.
#
# Beispiele:
#   PURGE_NOZZLE                      40 mm, 240 C, Fan 25%, danach wischen
#   PURGE_NOZZLE LEN=15 WIPE=0        nur kurz nachdruecken, kein Wisch
#   PURGE_NOZZLE KEEPHOT=1            Heizung bleibt an fuer den naechsten Klick
[gcode_macro PURGE_NOZZLE]
description: Ueber dem Purge Bucket purgen (LEN= TEMP= FAN= WIPE= KEEPHOT=)
gcode:
    {% set s = printer["gcode_macro _LOAD_SETTINGS"] %}
    {% set tc = printer.toolchanger %}
    {% set len = params.LEN|default(s.purge_len)|float %}
    {% set temp = params.TEMP|default(s.temp_default)|float %}
    {% set fan = params.FAN|default(s.purge_fan)|float %}
    {% set homed = "xyz" in printer.toolhead.homed_axes %}

    {% if printer.print_stats.state == "printing" %}
        { action_respond_info("PURGE abgebrochen: Druck laeuft.") }
    {% elif tc.tool == None %}
        { action_respond_info("PURGE abgebrochen: kein Tool aktiv.") }
    {% elif len <= 0 %}
        { action_respond_info("PURGE abgebrochen: LEN muss groesser 0 sein.") }
    {% else %}
        {% set n = tc.tool_number|default(0)|int %}
        {% set cur = printer[printer.toolhead.extruder].temperature|float %}

        # Nur hochheizen, nie herunter. Wer schon auf 250 druckt, soll nicht
        # auf das Abkuehlen auf 240 warten muessen.
        {% if cur < temp %}
            { action_respond_info("PURGE T%d: heize auf %.0f C ..." % (n, temp)) }
            M109 S{temp}
        {% endif %}

        {% if homed %}
            _GOTO_PURGE_POS
        {% else %}
            { action_respond_info("PURGE: nicht gehomt, wird an Ort und Stelle gepurgt.") }
        {% endif %}

        {% set fan_prev = printer["fan_generic fan0"].speed|default(0)|float %}
        M106 S{(fan * 255)|round|int}

        SAVE_GCODE_STATE NAME=_purge_state
        M83
        G1 E{len} F{s.purge_speed}
        G1 E-2 F{s.slow_speed}          # kurzer Rueckzug gegen Nachtropfen
        M400
        RESTORE_GCODE_STATE NAME=_purge_state

        {% if homed and params.WIPE|default(1)|int == 1 %}
            CLEAN_NOZZLE
        {% endif %}

        M106 S{(fan_prev * 255)|round|int}

        {% if params.KEEPHOT|default(0)|int == 0 %}
            M104 S0
            { action_respond_info("PURGE T%d fertig: %.0f mm, Heizung aus." % (n, len)) }
        {% else %}
            { action_respond_info("PURGE T%d fertig: %.0f mm, Heizung bleibt an." % (n, len)) }
        {% endif %}
    {% endif %}

[gcode_macro _UNLOAD_SETTINGS]
description: Gemeinsame Werte fuer die Unload-Makros
variable_temp_default: 240      # ABS/ASA; PLA kommt mit 210 aus
variable_slow_len: 15           # mm, langsamer Teil direkt an der Duese
variable_slow_speed: 300        # mm/min = 5 mm/s
variable_fast_len: 70           # mm, Rest bis zum Antrieb
variable_fast_speed: 2400       # mm/min = 40 mm/s
variable_tip_push: 8            # mm vorschieben zur Spitzenformung
variable_tip_speed: 180         # mm/min = 3 mm/s
gcode:

# ------------------------------------------------------------------------------
# UNLOAD_FILAMENT [T=<n>] [TEMP=<c>] [LEN=<mm>]
# ------------------------------------------------------------------------------
# Ohne T: das gerade aktive Tool. Mit T: dorthin wechseln und entladen.
[gcode_macro UNLOAD_FILAMENT]
description: Filament aus einem Toolhead ausziehen (T= TEMP= LEN=)
gcode:
    {% set s = printer["gcode_macro _UNLOAD_SETTINGS"] %}
    {% set tc = printer.toolchanger %}
    {% set temp = params.TEMP|default(s.temp_default)|float %}
    {% set total = params.LEN|default(s.slow_len + s.fast_len)|float %}
    {% set slow = [s.slow_len, total]|min %}
    {% set fast = total - slow %}
    {% set want = params.T|default(-1)|int %}

    {% if printer.print_stats.state == "printing" %}
        { action_respond_info("UNLOAD abgebrochen: Druck laeuft.") }
    {% elif want < 0 and tc.tool == None %}
        { action_respond_info("UNLOAD abgebrochen: kein Tool aktiv. T=<nummer> angeben.") }
    {% elif want >= 0 and ("tool T" + want|string) not in printer %}
        { action_respond_info("UNLOAD abgebrochen: Tool T%d unbekannt." % want) }
    {% else %}
        # Bei Bedarf zum gewuenschten Tool wechseln
        {% if want >= 0 and tc.tool_number|default(-1)|int != want %}
            { action_respond_info("UNLOAD: wechsle zu T%d ..." % want) }
            T{want}
            M400
        {% endif %}

        {% set n = printer.toolchanger.tool_number|default(0)|int %}
        { action_respond_info("UNLOAD T%d: heize auf %.0f C ..." % (n, temp)) }
        M109 S{temp}

        # Ueber den Purge Bucket, damit der Tip-Push nicht aufs Bett tropft.
        # Ungehomt passiert nichts, dann wird an Ort und Stelle geformt.
        {% if "xyz" in printer.toolhead.homed_axes %}
            _GOTO_PURGE_POS
        {% else %}
            { action_respond_info("UNLOAD: nicht gehomt, Tip-Push an Ort und Stelle.") }
        {% endif %}

        SAVE_GCODE_STATE NAME=_unload_state
        M83                                  # relative Extrusion
        # Spitze formen: kurz vor, dann in einem Zug heraus
        G1 E{s.tip_push} F{s.tip_speed}
        G1 E-{slow} F{s.slow_speed}
        {% if fast > 0 %}
            G1 E-{fast} F{s.fast_speed}
        {% endif %}
        M400
        RESTORE_GCODE_STATE NAME=_unload_state

        # Heizung sofort aus - und zwar bevor irgendein Wechsel folgt.
        # Ein Kopf mit 240 C im Dock schmort das Silikonpad weg.
        M104 S0
        { action_respond_info("UNLOAD T%d fertig: %.0f mm ausgezogen, Heizung aus." % (n, total)) }
    {% endif %}

# ------------------------------------------------------------------------------
# UNLOAD_ALL [TEMP=<c>] [LEN=<mm>] [TOOLS=0,1,2...]
# ------------------------------------------------------------------------------
# Entlaedt mehrere Toolheads nacheinander. Am Ende wird das Tool abgelegt,
# damit der Drucker nicht mit heissem Kopf stehen bleibt.
[gcode_macro UNLOAD_ALL]
description: Filament aus allen (oder ausgewaehlten) Toolheads ausziehen
gcode:
    {% set s = printer["gcode_macro _UNLOAD_SETTINGS"] %}
    {% set temp = params.TEMP|default(s.temp_default)|float %}
    {% set total = params.LEN|default(s.slow_len + s.fast_len)|float %}
    {% set list = params.TOOLS|default("0,1,2,3,4,5") %}
    {% set homed = printer.toolhead.homed_axes %}

    {% if printer.print_stats.state == "printing" %}
        { action_respond_info("UNLOAD_ALL abgebrochen: Druck laeuft.") }
    {% elif "x" not in homed or "y" not in homed or "z" not in homed %}
        { action_respond_info("UNLOAD_ALL abgebrochen: nicht gehomt (%s). Erst G28." % homed) }
    {% else %}
        {% for t in list.split(",") %}
            {% set n = t|trim|int %}
            {% set sens = "filament_switch_sensor T" + n|string + "_filament_sensor" %}
            {% if ("tool T" + n|string) not in printer %}
                { action_respond_info("UNLOAD_ALL: T%d uebersprungen (unbekannt)." % n) }
            {% elif sens in printer and not printer[sens].filament_detected %}
                { action_respond_info("UNLOAD_ALL: T%d uebersprungen (kein Filament)." % n) }
            {% else %}
                UNLOAD_FILAMENT T={n} TEMP={temp} LEN={total}
            {% endif %}
        {% endfor %}

        # Heizungen aus und Kopf ablegen - sonst steht ein heisses Tool herum
        TURN_OFF_HEATERS
        #{% if printer.toolchanger.tool != None %}
        #    PARK_TOOLHEAD
        #{% endif %}
        # This check used to be rendered before the loop ran, so it missed a
        # tool picked up during the unload. PARK_TOOLHEAD checks itself.
        PARK_TOOLHEAD
        { action_respond_info("UNLOAD_ALL fertig.") }
    {% endif %}

# ==============================================================================
# LOAD_FILAMENT / LOAD_WATCH
# ==============================================================================
# Gegenstueck zum Unload, ebenfalls zweistufig:
#
#   Stufe 1 - zuegig (40 mm/s) durch das Bowdenstueck bis kurz vor die
#             Schmelzzone. Dort ist noch nichts heiss, schnell ist unkritisch.
#   Stufe 2 - langsam (5 mm/s) durch die Schmelzzone, damit das Filament Zeit
#             hat aufzuschmelzen und der Antrieb nicht durchrutscht.
#   Danach  - etwas Purge, bis sauberes Material kommt.
#
# LOAD_WATCH nutzt die Filamentsensoren: sobald an einem Toolhead Filament
# erkannt wird, heizt dieser auf und zieht selbsttaetig ein. Damit muss man
# nur noch einstecken.
# ==============================================================================

[gcode_macro _LOAD_SETTINGS]
description: Gemeinsame Werte fuer die Load-Makros
variable_temp_default: 240
variable_fast_len: 60           # mm bis kurz vor die Schmelzzone
variable_fast_speed: 2400       # mm/min = 40 mm/s
variable_slow_len: 25           # mm durch die Schmelzzone
variable_slow_speed: 300        # mm/min = 5 mm/s
variable_purge_len: 40          # mm bis sauberes Material kommt
variable_purge_speed: 180       # mm/min = 3 mm/s
variable_purge_fan: 0.25        # Part Fan waehrend Purge und Wisch (0..1).
                                # fan0 ist der CPAP-Blower, dessen max_power
                                # bereits auf 0.72 begrenzt ist.
gcode:

# ------------------------------------------------------------------------------
# LOAD_FILAMENT [T=<n>] [TEMP=<c>] [PURGE=<mm>]
# ------------------------------------------------------------------------------
[gcode_macro LOAD_FILAMENT]
description: Filament in einen Toolhead einziehen (T= TEMP= PURGE= KEEPHOT= WIPE=)
gcode:
    {% set s = printer["gcode_macro _LOAD_SETTINGS"] %}
    {% set tc = printer.toolchanger %}
    {% set temp = params.TEMP|default(s.temp_default)|float %}
    {% set purge = params.PURGE|default(s.purge_len)|float %}
    {% set want = params.T|default(-1)|int %}

    {% if printer.print_stats.state == "printing" %}
        { action_respond_info("LOAD abgebrochen: Druck laeuft.") }
    {% elif want < 0 and tc.tool == None %}
        { action_respond_info("LOAD abgebrochen: kein Tool aktiv. T=<nummer> angeben.") }
    {% elif want >= 0 and ("tool T" + want|string) not in printer %}
        { action_respond_info("LOAD abgebrochen: Tool T%d unbekannt." % want) }
    {% else %}
        {% if want >= 0 and tc.tool_number|default(-1)|int != want %}
            { action_respond_info("LOAD: wechsle zu T%d ..." % want) }
            T{want}
            M400
            G4 P500
        {% endif %}

        # Nummer erst NACH dem Wechsel lesen - vorher zeigt sie noch das
        # alte Tool, und M109 wuerde den falschen Extruder heizen.
        {% set n = want if want >= 0 else printer.toolchanger.tool_number|default(0)|int %}
        { action_respond_info("LOAD T%d: heize auf %.0f C ..." % (n, temp)) }
        M109 S{temp}

        # Ueber den Purge Bucket fahren. Ungehomt wird an Ort und Stelle
        # gepurgt, dann entfaellt auch der Wisch danach.
        {% set homed = "xyz" in printer.toolhead.homed_axes %}
        {% if homed %}
            _GOTO_PURGE_POS
        {% else %}
            { action_respond_info("LOAD: nicht gehomt, wird an Ort und Stelle gepurgt.") }
        {% endif %}

        # Part Fan an: das ausgedrueckte Material erstarrt sofort und laesst
        # sich als Strang abziehen statt als Faden zu ziehen.
        {% set fan_prev = printer["fan_generic fan0"].speed|default(0)|float %}
        M106 S{(s.purge_fan * 255)|round|int}

        SAVE_GCODE_STATE NAME=_load_state
        M83
        G1 E{s.fast_len} F{s.fast_speed}
        G1 E{s.slow_len} F{s.slow_speed}
        {% if purge > 0 %}
            G1 E{purge} F{s.purge_speed}
        {% endif %}
        G1 E-2 F{s.slow_speed}          # kurzer Rueckzug gegen Nachtropfen
        M400
        RESTORE_GCODE_STATE NAME=_load_state

        # Wischen. Achtung: das passiert bei Ladetemperatur, holt also den
        # Klumpen herunter, hinterlaesst aber einen Film. Die probe-saubere
        # Duese macht erst der Wisch bei 150 C im PRINT_START.
        {% if homed and params.WIPE|default(1)|int == 1 %}
            CLEAN_NOZZLE
        {% endif %}

        # Fan zurueck auf den Wert von vorher
        M106 S{(fan_prev * 255)|round|int}

        # Heizung aus, sofern nicht ausdruecklich anders gewuenscht. Ein Kopf
        # mit 240 C, der danach ins Dock faehrt, schmort das Silikonpad.
        {% if params.KEEPHOT|default(0)|int == 0 %}
            M104 S0
            { action_respond_info("LOAD T%d fertig, Heizung aus. Duese pruefen." % n) }
        {% else %}
            { action_respond_info("LOAD T%d fertig, Heizung bleibt an." % n) }
        {% endif %}
    {% endif %}

# ------------------------------------------------------------------------------
# LOAD_WATCH [TEMP=<c>] / LOAD_WATCH_STOP
# ------------------------------------------------------------------------------
# Beobachtet alle Filamentsensoren. Wird an einem Toolhead Filament erkannt,
# der vorher leer war, heizt dieser auf und zieht ein.
#
# Der Zustand wird in variable_seen gehalten - so wird nur auf die Flanke
# reagiert (leer -> belegt), nicht dauernd auf ein bereits gestecktes
# Filament.
[gcode_macro LOAD_WATCH]
description: Auf Filamenteinlage warten und automatisch einziehen
variable_active: 0
variable_temp: 240
variable_seen: {}
gcode:
    {% set t = params.TEMP|default(printer["gcode_macro _LOAD_SETTINGS"].temp_default)|float %}
    SET_GCODE_VARIABLE MACRO=LOAD_WATCH VARIABLE=temp VALUE={t}
    SET_GCODE_VARIABLE MACRO=LOAD_WATCH VARIABLE=active VALUE=1
    # Ausgangslage merken, damit bereits gestecktes Filament nicht sofort
    # eingezogen wird
    {% set cur = {} %}
    {% for i in range(6) %}
        {% set key = "filament_switch_sensor T" + i|string + "_filament_sensor" %}
        {% if key in printer %}
            {% set _ = cur.update({i|string: printer[key].filament_detected}) %}
        {% endif %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=LOAD_WATCH VARIABLE=seen VALUE="{cur}"
    UPDATE_DELAYED_GCODE ID=_load_watch_tick DURATION=1
    { action_respond_info("LOAD_WATCH aktiv bei %.0f C. Filament einstecken - Stopp mit LOAD_WATCH_STOP." % t) }

[gcode_macro LOAD_WATCH_STOP]
description: Automatisches Einziehen beenden
gcode:
    SET_GCODE_VARIABLE MACRO=LOAD_WATCH VARIABLE=active VALUE=0
    UPDATE_DELAYED_GCODE ID=_load_watch_tick DURATION=0
    { action_respond_info("LOAD_WATCH beendet.") }

[delayed_gcode _load_watch_tick]
gcode:
    {% set w = printer["gcode_macro LOAD_WATCH"] %}
    {% if w.active|int == 1 %}
        {% set seen = w.seen %}
        {% set found = namespace(tool=-1) %}
        {% for i in range(6) %}
            {% set key = "filament_switch_sensor T" + i|string + "_filament_sensor" %}
            {% if key in printer %}
                {% set now = printer[key].filament_detected %}
                {% set before = seen.get(i|string, false) %}
                {% if now and not before and found.tool < 0 %}
                    {% set found.tool = i %}
                {% endif %}
            {% endif %}
        {% endfor %}

        # Zustand fortschreiben
        {% set cur = {} %}
        {% for i in range(6) %}
            {% set key = "filament_switch_sensor T" + i|string + "_filament_sensor" %}
            {% if key in printer %}
                {% set _ = cur.update({i|string: printer[key].filament_detected}) %}
            {% endif %}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=LOAD_WATCH VARIABLE=seen VALUE="{cur}"

        {% if found.tool >= 0 and printer.print_stats.state != "printing" %}
            { action_respond_info("LOAD_WATCH: Filament an T%d erkannt - ziehe ein." % found.tool) }
            LOAD_FILAMENT T={found.tool} TEMP={w.temp}
        {% endif %}

        UPDATE_DELAYED_GCODE ID=_load_watch_tick DURATION=1
    {% endif %}


# ==============================================================================
# Sensorwahl fuer Resonanzmessungen
# ==============================================================================
# Die Sensoren heissen "adxl345 T0" bis "adxl345 T5". Der Name enthaelt ein
# Leerzeichen, und Klipper zerlegt Befehlszeilen daran - deshalb scheitert
#   AXES_SHAPER_CALIBRATION ACCEL_CHIP="adxl345 T1"
# mit "Malformed command".
#
# accel_chip wird zudem nur beim Start gelesen. Das Skript aendert die Zeile
# in T0.cfg und startet Klipper neu.

[gcode_shell_command use_accel]
command: /home/pi/bin/use-accel
timeout: 30.0
verbose: True

[gcode_macro USE_ACCEL_T0]
description: Resonanzmessungen nutzen den Sensor von T0 (Klipper startet neu)
gcode:
    RUN_SHELL_COMMAND CMD=use_accel PARAMS=0

[gcode_macro USE_ACCEL_T1]
description: Resonanzmessungen nutzen den Sensor von T1 (Klipper startet neu)
gcode:
    RUN_SHELL_COMMAND CMD=use_accel PARAMS=1

[gcode_macro USE_ACCEL_T2]
description: Resonanzmessungen nutzen den Sensor von T2 (Klipper startet neu)
gcode:
    RUN_SHELL_COMMAND CMD=use_accel PARAMS=2

[gcode_macro USE_ACCEL_T3]
description: Resonanzmessungen nutzen den Sensor von T3 (Klipper startet neu)
gcode:
    RUN_SHELL_COMMAND CMD=use_accel PARAMS=3

[gcode_macro USE_ACCEL_T4]
description: Resonanzmessungen nutzen den Sensor von T4 (Klipper startet neu)
gcode:
    RUN_SHELL_COMMAND CMD=use_accel PARAMS=4

[gcode_macro USE_ACCEL_T5]
description: Resonanzmessungen nutzen den Sensor von T5 (Klipper startet neu)
gcode:
    RUN_SHELL_COMMAND CMD=use_accel PARAMS=5
