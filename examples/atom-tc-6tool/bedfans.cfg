############### Config options ##################
[gcode_macro _BEDFANVARS]
variable_threshold: 100     # If bed temp target is above this threshold, fans will be enabled. If temp is set to below this threshold, fans will be disabled.
variable_chamber_threshold: 55  # Chamber temp threshold - fans turn off when chamber reaches this temp
variable_fast: 1.0          # Fan speed once bed temp is reached
variable_slow: 0.2          # Fan speed while bed is heating
variable_cooldown_time: 300 # Cooldown time in seconds after print (5 minutes)
gcode:

########## Bed Fans #########
[fan_generic BedFans]
pin: PD15                                 # Replaces Nevermore on PD15
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 0.5
off_below: 0.10
cycle_time: 0.010

########## Aliases #########
[gcode_macro BEDFANSSLOW]
gcode:
    # Vars
    {% set SLOW = printer["gcode_macro _BEDFANVARS"].slow|float %}
    SET_FAN_SPEED FAN=BedFans SPEED={SLOW}

[gcode_macro BEDFANSFAST]
gcode:
    # Vars
    {% set FAST = printer["gcode_macro _BEDFANVARS"].fast|float %}
    SET_FAN_SPEED FAN=BedFans SPEED={FAST}

[gcode_macro BEDFANSOFF]
gcode:
    SET_FAN_SPEED FAN=BedFans SPEED=0

############ Command overrides ############
# Override, set fan speeds to low and start monitoring loop.
[gcode_macro SET_HEATER_TEMPERATURE]
rename_existing: SET_HEATER_TEMPERATURE_OLD
gcode:
    # Parameters
    {% set HEATER = params.HEATER|default("None") %}
    {% set TARGET = params.TARGET|default(0)|int %}
    # Vars
    {% set THRESHOLD = printer["gcode_macro _BEDFANVARS"].threshold|int %}

    {% if HEATER|lower == "heater_bed" %}
        M99140 S{TARGET}
    {% else %}
        SET_HEATER_TEMPERATURE_OLD HEATER={HEATER} TARGET={TARGET}
    {% endif %}
    # Set fans to low if heater_bed temp is requested above threshold temp, and kick off monitoring loop.
    {% if HEATER|lower == "heater_bed" %}
        {% if TARGET >= THRESHOLD %}
            UPDATE_DELAYED_GCODE ID=bedfans_cooldown DURATION=0                # Cancel cooldown timer (new print starting)
            BEDFANSSLOW
            UPDATE_DELAYED_GCODE ID=bedfanloop DURATION=1
        {% else %}
            BEDFANSOFF
            UPDATE_DELAYED_GCODE ID=bedfanloop DURATION=0                      # Cancel bed fan loop if it's running
        {% endif %}
    {% endif %}

# Override M190 (Wait for Bed Temperature)
[gcode_macro M190]
rename_existing: M99190
gcode:
    # Parameters
    {% set S = params.S|default(0)|int %}
    # Vars
    {% set THRESHOLD = printer["gcode_macro _BEDFANVARS"].threshold|int %}

    {% if S >= THRESHOLD %}
        UPDATE_DELAYED_GCODE ID=bedfans_cooldown DURATION=0                    # Cancel cooldown timer (new print starting)
        BEDFANSSLOW                                                             # >= Threshold temp: Low speed fans while heating
    {% else %}
        BEDFANSOFF                                                              # < Threshold temp: Turn bed fans off
    {% endif %}
    M140 {% for p in params
      %}{'%s%s' % (p, params[p])}{%
      endfor %}                                                                 # Set bed temp

    {% if S != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={S|int} MAXIMUM={S|int + 5}  # Wait for bed temp within 5 degrees
    {% endif %}
    # Post-heating fan speeds
    {% if S >= THRESHOLD %}
        BEDFANSFAST                                                             # >= Threshold temp: Higher speed fans after heating finished
    {% endif %}

# Replace M140 (Set Bed Temperature) to just be an alias of SET_HEATER_TEMPERATURE (which has associated bed fan logic if enabled)
[gcode_macro M140]
rename_existing: M99140
gcode:
    # Parameters
    {% set S = params.S|default(0)|float %}
    
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={S}

# Replace TURN_OFF_HEATERS
[gcode_macro TURN_OFF_HEATERS]
rename_existing: TURN_OFF_HEATERS_OLD
gcode:
    # Vars
    {% set COOLDOWN = printer["gcode_macro _BEDFANVARS"].cooldown_time|int %}

    TURN_OFF_HEATERS_OLD
    BEDFANSFAST                                                                 # Start cooldown at FAST speed
    UPDATE_DELAYED_GCODE ID=bedfans_cooldown DURATION={COOLDOWN}               # Start 5-minute cooldown timer

################ Monitoring loop #####################
# Turns bed fans to "fast" speed once target bed temp is reached.
# Turns off fans when chamber reaches threshold temp.
# Turns fans back on when chamber drops below threshold.
[delayed_gcode bedfanloop]
gcode:
    # Vars
    {% set THRESHOLD = printer["gcode_macro _BEDFANVARS"].threshold|int %}
    {% set CHAMBER_THRESHOLD = printer["gcode_macro _BEDFANVARS"].chamber_threshold|int %}
    {% set CHAMBER_TEMP = printer["temperature_sensor Chamber"].temperature|default(0)|int %}
    {% set BED_AT_TARGET = printer.heater_bed.temperature|int >= (printer.heater_bed.target|int - 1) %}

    {% if printer.heater_bed.target >= THRESHOLD %}                             # Continue only if target temp greater than threshold.
        {% if CHAMBER_TEMP >= CHAMBER_THRESHOLD %}
            BEDFANSOFF                                                          # Chamber temp reached: Turn off fans
        {% elif BED_AT_TARGET %}
            BEDFANSFAST                                                         # Bed at temp, chamber below threshold: Fast fans
        {% else %}
            BEDFANSSLOW                                                         # Bed still heating: Slow fans
        {% endif %}
        UPDATE_DELAYED_GCODE ID=bedfanloop DURATION=5                           # Always keep monitoring
    {% endif %}

################ Cooldown after print #####################
# Runs BedFans for 5 minutes after print ends (for activated carbon filter)
[delayed_gcode bedfans_cooldown]
gcode:
    BEDFANSOFF                                                                  # Turn off fans after cooldown period